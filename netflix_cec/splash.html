<!doctype html>
<!-- netflix-cec: pantalla que se ve mientras arranca el navegador; el servicio navega a Netflix apenas se conecta. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Abriendo Netflix…</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; cursor: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
         font: 600 clamp(20px, 2.6vw, 56px)/1.3 "Netflix Sans", Helvetica, Arial, sans-serif; }
  /* El script de netflix-cec acorta todas las animaciones (reduce_effects): este selector le gana. */
  #spin { width: 9vh; height: 9vh; box-sizing: border-box; border-radius: 50%;
          border: 1vh solid rgba(255, 255, 255, .18); border-top-color: #e50914;
          animation: spin .9s linear infinite !important; animation-duration: .9s !important;
          animation-iteration-count: infinite !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #hint { font-size: .55em; font-weight: 400; color: #999; opacity: 0; }
  #hint.on { opacity: 1; }
</style>
</head>
<body>
  <div id="spin"></div>
  <div>Abriendo Netflix…</div>
  <div id="hint">Si no avanza, revisá que el servicio netflix-cec esté funcionando (netflix-cec diagnostico).</div>
  <script>setTimeout(() => document.getElementById('hint').classList.add('on'), 25000);</script>
</body>
</html>
