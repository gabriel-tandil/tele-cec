#  Selectores CSS de Netflix. Netflix cambia su web cada tanto: si algo deja de
#  andar, corré  tele-cec diagnostico  y ajustá acá. Lo que pongas reemplaza
#  al valor por defecto de esa clave.
# -----------------------------------------------------------------------------
[selectors]
