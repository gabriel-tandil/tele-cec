# dirección (sin el parche, GTK solo mueve el foco dentro de cada bloque). Canal + y − saltan al elemento
# siguiente o anterior (Tab / Shift+Tab), por si algo se traba. El resto de las teclas, como en [keys.tidal].
# music:move:<Flecha> (experimental) sigue el foco por accesibilidad, pero escuchar esos eventos puede cerrar
# High Tide (error de GTK 4): por eso no se usa.
