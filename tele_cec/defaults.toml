# Reposo automático: si no sale sonido y nadie toca el control, la Raspberry Pi descansa (antes avisa en
# pantalla; cualquier tecla lo cancela) y apaga la TV por CEC.
#   mode = "reposo": pausa y cierra todo. Vuelve al apretar una tecla o al prenderse la TV y muestra el menú de
#                    actividades (con resume_apps = true reabre lo que estaba abierto, en pausa).
#   mode = "apagar": apaga la Pi. El control no la vuelve a prender (en una Pi 400: Fn+F10, o desenchufar y
#                    enchufar), y hace falta una regla de polkit (./install.sh --apagado-automatico).
[power]
enabled = false
mode = "reposo"
idle_minutes = 180            # sin sonido ni teclas del control (una presentación de fotos sin música no cuenta)
tv_off_minutes = 15           # si la TV avisó por CEC que se apagó (standby): alcanza con menos
menu_idle_minutes = 10        # sin ninguna actividad abierta (solo el menú en pantalla) y sin teclas (0 = idle_minutes)
warn_seconds = 60             # cuenta regresiva en pantalla antes (cualquier tecla la cancela)
timer_postpone_minutes = 15   # temporizador para apagar: una tecla en su último minuto lo retrasa tanto
tv_standby = true             # apagar también la TV por CEC
wake_on_tv = true             # en reposo: volver cuando se prende la TV (sin cambiarle la entrada)
resume_apps = false           # al volver: false = el menú de actividades; true = reabrir lo que estaba abierto, en pausa
off_after_hours = 72          # en reposo tantas horas seguidas sin que nadie la despierte: apagarla de verdad
                              # (0 = nunca). Apagada, el control no la prende: Fn+F10 en la Pi 400 o desenchufar.
command = ["systemctl", "poweroff"]   # para mode = "apagar"

# Joysticks (Xbox 360/One, 8BitDo, PlayStation…): cada botón hace lo mismo que una tecla del control, en
# todas las apps. Se detectan solos al conectarlos (USB, receptor inalámbrico o Bluetooth).
[gamepad]
enabled = true
menu_only_in = ["juegos", "app"]   # contextos donde el joystick es del programa (los juegos de MAME, un emulador
                              # en [activities.*]): ahí el servicio solo atiende exit_buttons y menu_buttons
menu_buttons = ["GUIDE"]      # el botón del medio: nuestro menú encima (en los juegos, la lista, con el juego en
                              # pausa). Otros: "BACK+START" (los dos juntos), "BACK:HOLD" (Back mantenido)
exit_buttons = []             # botones que salen del juego directo, p. ej. ["BACK:HOLD"] (un toque de Back
                              # sigue siendo la moneda de MAME)
hold_buttons = ["BACK", "GUIDE"]   # botones que avisan «mantenido» (BACK:HOLD, GUIDE:HOLD)
hold_ms = 1000
deadzone = 0.55               # cuánto hay que mover la palanca (0–1)
repeat_delay_ms = 400         # mantener una dirección la repite, como el control
repeat_ms = 130

[gamepad.buttons]             # botón → tecla del control (nombres de tele-cec aprender); "" = nada
A = "SELECT"
B = "EXIT"
X = "PAUSE_PLAY_FUNCTION"
Y = "F4_YELLOW"               # en el Xbox los colores coinciden: Y amarillo
LB = "BACKWARD"
RB = "FORWARD"
LT = "REWIND"
RT = "FAST_FORWARD"
BACK = "F1_BLUE"
START = "CONTENTS_MENU"       # abre el menú
GUIDE = "CONTENTS_MENU"       # el botón del medio (Xbox), también
LS = "F2_RED"                 # apretar la palanca izquierda
RS = "F3_GREEN"               # apretar la palanca derecha
DPAD_UP = "UP"                # la cruz y la palanca izquierda
DPAD_DOWN = "DOWN"
DPAD_LEFT = "LEFT"
DPAD_RIGHT = "RIGHT"
RS_UP = "VOLUME_UP"           # la palanca derecha
RS_DOWN = "VOLUME_DOWN"
RS_LEFT = ""
RS_RIGHT = ""

# Menú de actividades.
[menu]
items = ["netflix", "youtube", "tidal", "local", "radio", "fotos", "juegos", "android"]   # orden; las no instaladas no aparecen. Las de
                                                  # [activities.<id>] se agregan al final si no están acá.
                                                  # Un nombre de [menu.groups] es una «carpeta» con otras adentro.
columns = 2                   # en dos columnas (sin desplazar): ◀ ▶ cambian de columna. OK abre de una; Videos,
                              # Fotos y Android tienen un botoncito («Carpetas», «Conectar»): ▶ lo enfoca y OK lo
                              # abre (o el amarillo). 1 = una columna, con ▶ = más opciones
timeout_s = 10                # con una app abierta, se cierra solo si no tocás nada (sin nada abierto queda a la vista)
open_on_start = true          # al prender la Pi (al arrancar el servicio), el menú aparece abierto
sound = true                  # opción «Sonido» al final del menú: elegir la salida (TV por HDMI, Bluetooth…)
keyboard = true               # mientras el menú está a la vista, también se maneja con el teclado: flechas,
                              # Enter elige, Esc o Retroceso vuelve, números, F1 ayuda, tecla Menú = siguiente

[menu.groups.local]           # «Videos y música»: una fila del menú que abre otra lista con estas actividades
name = "Videos y música"
icon = "local.svg"
items = ["videos", "musica"]

# Control desde el celular: una página en http://raspberrypi.local:8765/ (en la misma red Wi‑Fi) con el control
# remoto, lo que está sonando (play/pausa, anterior, siguiente), el volumen y la salida de sonido. En el celular:
# «Agregar a la pantalla de inicio» y queda como una app. No tiene contraseña: solo atiende a la red de la casa.
[web]
enabled = true
port = 8765
lan_only = true               # rechazar lo que no venga de la red local (direcciones privadas)
volume_step = 5               # cuánto sube o baja el volumen cada toque (%)
menu_qr = true                # el menú de actividades de la TV muestra un QR para abrir esta página en el celular

[apps.netflix]
on_reselect = "continue_watching"   # app:netflix con Netflix ya abierto

[apps.tidal]                         # Tidal con High Tide (Flatpak; ver README → Tidal)
on_reselect = "music:my_tracks"      # app:tidal con Tidal ya abierto: Mis canciones
flatpak_id = "io.github.nokse22.high-tide"
resume_on_open = false               # al abrir Tidal: false = en Inicio y en pausa; true = seguir con lo último que sonaba
start_in_nav = true                  # al abrir Tidal, las flechas mueven el foco (0 cambia a controles: volumen, temas)
volume_step = 0.05
start_timeout = 60                   # segundos para que High Tide termine de abrir (en una Pi tarda)
# Cómo dibuja High Tide (GTK 4). En la Pi, con Vulkan (el de GTK) se queda sin memoria del driver y se
# cierra solo al cambiar de vista (por ejemplo, al abrir las letras): con OpenGL ("ngl") no pasa.
gsk_renderer = "ngl"                 # "" = el que elija GTK
focus_color = "#FFD400"              # marco y fondo del elemento con el foco (GTK lo dibuja muy tenue); "" = no tocar
keyboard_cards = true                # portadas de discos/playlists elegibles con el control y OK (parche al abrir High Tide)

[apps.youtube]                       # YouTube para TV, en un navegador aparte (perfil propio)
url = "https://www.youtube.com/tv"
engine = ""                          # "" = el mismo que Netflix (browser.engine); o "firefox" / "chromium"
profile = ""                         # "" = ~/.config/firefox-youtube o ~/.config/chromium-youtube según el navegador
force_h264 = true                    # como h264ify: la Pi decodifica H.264 por hardware (VP9/AV1 van por CPU)
user_agent = ""                      # "" = el de una TV (YouTube muestra la versión para TV solo a TVs)
open_wait_s = 10                     # el navegador tarda en abrir: el menú muestra «Abriendo YouTube…» este tiempo

[apps.videos]                        # Videos con mpv: la carpeta entera (y sus subcarpetas) en pantalla completa
# Se usa la primera carpeta que tenga videos: los pendrives van primero. (sudo apt install mpv mpv-mpris)
folders = ["/media/*/*", "~/Vídeos", "~/Videos"]
shuffle = false                      # orden aleatorio
resume = true                        # Seguir viendo: recordar dónde quedó cada video (y preguntar al abrirlo)
volume_step = 0.05
command = []                         # otro programa en vez de mpv; {carpeta} = la carpeta elegida, p. ej.
                                     #   ["vlc", "--fullscreen", "{carpeta}"]

[apps.musica]                        # Música local con mpv: los temas de la carpeta, con la tapa del disco en la TV
folders = ["/media/*/*", "~/Música", "~/Music"]
shuffle = false
volume_step = 0.05
command = []

[apps.radio]                         # Radio por internet con mpv. ⏮ ⏭ cambian de radio; 1 – 9 eligen una
volume_step = 0.05
stations = []                        # sin ninguna: se ponen en config.toml (ver config.example.toml), p. ej.
# stations = [
#   { name = "La 100", url = "https://playerservices.streamtheworld.com/api/livestream-redirect/FM999_56.mp3" },
#   { name = "Pipí Cucú", url = "https://comodin.uy/radio/8000/320.mp3" },
# ]

[apps.fotos]                         # Fotos: presentación en pantalla completa con mpv (sudo apt install mpv)
viewer = "mpv"                       # "mpv" = la placa de video achica las fotos, hace el zoom y las mueve;
                                     #   "feh" = el visor de antes para «solo fotos» (todo con el procesador)
folders = ["/media/*/*", "~/Imágenes", "~/Pictures"]
delay_s = 8                          # segundos por foto
shuffle = false
on_this_day = true                   # «Un día como hoy» en Carpetas: las fotos de esta fecha en otros años
today_shuffle = true                 # «Un día como hoy» al azar (false = del año más viejo al más nuevo)
show_date = false                    # la fecha de cada foto en una esquina, hasta que se toque 1 (después se
                                     # recuerda lo último elegido)
map = true                           # verde = dónde se sacó la foto (con GPS): un mapa de OpenStreetMap
map_tiles = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"   # de dónde salen los mosaicos del mapa
scroll_step = 150                    # píxeles que se mueve la foto con zoom por cada flecha
zoom_step = 25                       # % que acerca o aleja cada paso de zoom
command = []                         # otro visor en vez de feh ({carpeta} = la carpeta elegida)

[apps.juegos]                        # Juegos: las ROMs de MAME (ver README → Juegos)
rompath = []                         # [] = el rompath de ~/.mame/mame.ini (o ~/mame/roms); p. ej. ["~/mame/roms"]
binary = "mame"
extra_args = []                      # más opciones de MAME, p. ej. ["-skip_gameinfo"]
guide_menu = true                    # el botón del medio del joystick abre nuestro menú, no el de MAME (el de
                                     # MAME queda en Tab y en «Opciones de MAME» de la lista)
control = true                       # script Lua (-autoboot_script) para pausar y cerrar MAME bien

[apps.android]                       # Android: la pantalla de un celular o tablet en la TV, con scrcpy (ver README → Android)
# El celular se conecta por USB (con «Depuración USB» activada en Opciones de desarrollador) o por Wi‑Fi.
serial = ""                          # "" = el que esté conectado (primero el del cable); "192.168.0.50:5555" = ese
                                     #   celular por Wi‑Fi (tele-cec hace adb connect al abrirlo)
max_size = 1920                      # lado más largo de la imagen, en píxeles (menos = más liviano para la Pi; 0 = el del celular)
max_fps = 30                         # cuadros por segundo (0 = sin límite)
video_bit_rate = ""                  # "" = 8M (lo de scrcpy); p. ej. "4M" si por Wi‑Fi se corta
audio = true                         # el sonido del celular sale por la TV (Android 11 o más nuevo)
audio_dup = false                    # Android 13+: que siga sonando también en el celular
stay_awake = true                    # que el celular no se apague mientras está enchufado
turn_screen_off = false              # apagar la pantalla del celular (la imagen sigue en la TV)
power_off_on_close = false           # al cerrar, apagar la pantalla del celular
open_wait_s = 15                     # cuánto se espera a que aparezca la imagen
extra_args = []                      # más opciones de scrcpy, p. ej. ["--video-codec=h265"]

# Otras actividades: cualquier programa. Aparecen al final del menú (o donde las pongas en [menu] items).
# Al elegir otra actividad se cierra con SIGTERM. Mientras está abierta, las teclas usan [keys.app].
#   [activities.juegos]
#   name = "Juegos"
#   icon = "juegos.svg"              # juegos/musica/peliculas.svg vienen incluidos; o un archivo, un ícono del tema o un emoji
#   command = ["mame", "-rompath", "~/mame/roms"]
#   process = "mame"                 # nombre del proceso, si no es el del comando

# Macros: listas de acciones con nombre, se usan como "macro:<nombre>".
# Ejemplo:  [keys.browse]  NUMBER9 = "macro:perfil1_seguir"
[macros]
perfil1_seguir = ["profile:1", "wait:2500", "continue_watching"]

