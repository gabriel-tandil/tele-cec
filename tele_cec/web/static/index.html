<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Tele-CEC</title>
<style>
  /* Los mismos colores que el panel del menú en la TV (ui/menu_ui.py). */
  :root {
    --bg: #0b0b0e; --panel: rgba(18, 18, 22, 0.94); --panel-solid: #121216; --line: rgba(255, 255, 255, 0.10);
    --text: #f2f2f2; --muted: rgba(242, 242, 242, 0.72); --faint: rgba(242, 242, 242, 0.5);
    --row-hover: rgba(255, 255, 255, 0.07); --sel-bg: #f2f2f2; --sel-text: #111111;
    --badge: rgba(255, 255, 255, 0.16); --chip-line: rgba(255, 255, 255, 0.28); --msg: #ffd166; --heart: #f43f5e;
    --radius: 20px; --mini-h: 68px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* abajo, lugar para el reproductor chico solo cuando está a la vista */
  body { padding: max(10px, env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
  body:has(#mini:not([hidden])) { padding-bottom: calc(var(--mini-h) + 22px + env(safe-area-inset-bottom)); }
  main { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .pill { flex: none; font-size: 13px; padding: 5px 11px; border-radius: 999px; background: var(--badge); color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  .pill.sleep { color: var(--msg); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  [hidden] { display: none !important; }
  svg.i { width: 24px; height: 24px; fill: currentColor; vertical-align: middle; flex: none; }

  /* el panel, como en la TV */
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 12px;
    min-width: 0; }
  .ptitle { display: flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 4px 8px; }
  .ptitle h2 { font-size: 19px; margin: 0; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .back { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; margin-left: -4px; }
  .back:active { background: var(--row-hover); }
  .rows { display: grid; gap: 2px; }
  .row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center;
    padding: 8px 10px; border-radius: 14px; text-align: left; width: 100%; }
  .row:active { background: var(--sel-bg); color: var(--sel-text); }
  .row:active .sub, .row:active .badge, .row:active .chip { color: inherit; }
  .row.off { opacity: .45; }
  .row.cur { background: var(--row-hover); }
  .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; overflow: hidden;
    background: rgba(255,255,255,0.06) center/cover no-repeat; font-weight: 700; font-size: 18px; color: var(--muted); }
  .ic img { width: 100%; height: 100%; object-fit: contain; }
  .ic.round { border-radius: 50%; }
  .tx { min-width: 0; }
  .name { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { flex: none; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; background: var(--badge); }
  .chip { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 10px; border: 2px solid var(--chip-line);
    color: rgba(255,255,255,0.85); white-space: nowrap; }
  .chip:active { background: var(--sel-bg); color: var(--sel-text); border-color: var(--sel-bg); }
  .more { color: var(--faint); font-size: 20px; padding: 0 4px; }
  .note { color: var(--muted); font-size: 14px; padding: 16px 8px; text-align: center; }
  .note .go { margin-top: 12px; }
  .go { background: var(--sel-bg); color: var(--sel-text); font-weight: 700; padding: 11px 16px; border-radius: 12px; }
  .ghost { border: 2px solid var(--chip-line); font-weight: 700; padding: 9px 14px; border-radius: 12px; }
  .go:active, .ghost:active { filter: brightness(.85); }
  .sect { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--faint);
    margin: 14px 10px 4px; }
  input[type=search], input[type=text] { font: inherit; color: var(--text); background: rgba(255,255,255,0.08);
    border: 2px solid transparent; border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; outline: none; }
  input:focus { border-color: rgba(255,255,255,0.4); }
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 0 2px; }
  .hint { color: var(--faint); font-size: 13px; padding: 8px 6px 0; }
  .seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px 0 4px; padding: 0 2px; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: none; padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 600;
    border: 2px solid var(--chip-line); color: var(--muted); }
  .seg button.on { background: var(--sel-bg); color: var(--sel-text); border-color: var(--sel-bg); }
  .detail { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; margin: 4px 6px 8px; }
  .detail .ic { width: 92px; height: 92px; }
  .detail .name { font-size: 18px; }
  .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .loadmore { width: 100%; padding: 12px; color: var(--muted); }

  /* volumen */
  .vs { display: grid; grid-template-columns: minmax(0, 1fr) 40px 44px; gap: 6px; align-items: center; }
  .vbar { position: relative; height: 36px; margin: 0 9px; touch-action: none; cursor: pointer; }
  .vbar .tr { position: absolute; left: 0; right: 0; top: 16px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.14); overflow: hidden; }
  .vbar .tr > i { display: block; height: 100%; width: 0; background: var(--text); }
  .vbar .knob { position: absolute; top: 9px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--text); left: 0; }
  .vs .num { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .vs .mute { width: 44px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
  .vs .mute:active { background: var(--row-hover); }
  .vs.muted .tr > i, .vs.muted .knob { background: var(--faint); }
  .vs.muted .mute { color: var(--msg); background: var(--badge); }
  .vs.big { padding: 2px 0 10px; }

  /* Actividades sin scroll: si las filas no entran en la pantalla, se achican de a un paso (ver fit()) */
  .panel.dense-1 { padding: 10px 10px; }
  .dense-1 .ptitle { padding-bottom: 4px; }
  .dense-1 .row { padding: 6px 8px; gap: 10px; grid-template-columns: 42px minmax(0, 1fr) auto; }
  .dense-1 .ic { width: 42px; height: 42px; }
  .dense-1 .sndrow .vs { margin-left: 58px; }
  .dense-2 .row { padding: 4px 8px; grid-template-columns: 38px minmax(0, 1fr) auto; }
  .dense-2 .ic { width: 38px; height: 38px; border-radius: 10px; }
  .dense-2 .name { font-size: 16px; }
  .dense-2 .chip { padding: 4px 9px; }
  .dense-2 .sndrow .vs { margin: -6px 4px 0 54px; }
  .dense-2 .vs .mute { height: 34px; }
  .dense-2 .vbar { height: 30px; }
  .dense-2 .vbar .tr { top: 13px; }
  .dense-2 .vbar .knob { top: 6px; }
  .dense-3 .row { padding: 3px 8px; grid-template-columns: 34px minmax(0, 1fr) auto; }
  .dense-3 .ic { width: 34px; height: 34px; border-radius: 9px; font-size: 15px; }
  .dense-3 .name { font-size: 15px; }
  .dense-3 .sub { font-size: 12px; }
  .dense-3 .sndrow .vs { margin-left: 50px; }
  .sndrow .vs { margin: -8px 4px 4px 64px; }

  /* reproductor chico (abajo) y grande (hoja) */
  .mini { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); height: var(--mini-h);
    max-width: 500px; margin: 0 auto; background: var(--panel-solid); border: 2px solid var(--line); border-radius: 18px;
    display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px 48px; gap: 10px; align-items: center; padding: 0 10px; z-index: 6;
    box-shadow: 0 8px 30px rgba(0,0,0,.45); overflow: hidden; }
  .mini .ic { width: 48px; height: 48px; border-radius: 10px; }
  .mini .t1 { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .t2 { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini > button { height: 48px; border-radius: 50%; display: grid; place-items: center; }
  .mini > button:active { background: var(--row-hover); }
  .mini .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--text); width: 0; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 9; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--panel-solid); border: 2px solid var(--line); border-bottom: 0; width: 100%; max-width: 500px;
    border-radius: 22px 22px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
  .sheet { transition: transform .2s ease; }
  .sheet.dragging { transition: none; }
  .sheet-top { position: sticky; top: -10px; z-index: 1; margin: -10px -16px 6px; padding: 10px 16px 0; height: 44px;
    background: var(--panel-solid); display: flex; justify-content: center; touch-action: none; cursor: grab; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--badge); margin-top: 2px; }
  .sheet-x { position: absolute; right: 8px; top: 4px; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; color: var(--muted); }
  .sheet-x:active { background: var(--row-hover); }
  .big-art { width: min(72vw, 300px); aspect-ratio: 1; border-radius: 16px; margin: 4px auto 16px; display: grid; place-items: center;
    background: rgba(255,255,255,0.06) center/cover no-repeat; font-size: 64px; color: var(--faint); }
  .np-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; }
  .np-title { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-sub { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-from { color: var(--faint); font-size: 12px; margin-top: 2px; }
  .like { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .like.on { color: var(--heart); }
  .seek { position: relative; height: 28px; margin-top: 10px; touch-action: none; cursor: pointer; }
  .seek .tr { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.14); overflow: hidden; }
  .seek .tr > i { display: block; height: 100%; width: 0; background: var(--text); }
  .seek .knob { position: absolute; top: 7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--text); left: 0; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .transport { display: grid; grid-template-columns: 44px 1fr 72px 1fr 44px; align-items: center; justify-items: center; margin: 10px 0 6px; }
  .transport button { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
  .transport button:active { background: var(--row-hover); }
  .transport .main { width: 70px; height: 70px; background: var(--sel-bg); color: var(--sel-text); }
  .transport .main svg.i { width: 34px; height: 34px; }
  .transport svg.i { width: 30px; height: 30px; }
  .transport .small { width: 44px; height: 44px; color: var(--faint); position: relative; }
  .transport .small svg.i { width: 22px; height: 22px; }
  .transport .small.on { color: var(--sel-text); background: var(--sel-bg); }  /* prendido: bien a la vista */
  .transport .small .one { position: absolute; right: 4px; top: 4px; font-size: 10px; font-weight: 800; }
  .opts { display: grid; gap: 6px; margin-top: 12px; }
  .opts button { padding: 14px; text-align: left; border-radius: 12px; background: rgba(255,255,255,0.06); font-weight: 600; }
  .opts button:active { background: var(--sel-bg); color: var(--sel-text); }
  /* pantalla completa (arriba a la derecha) */
  .fsbtn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); margin-right: -4px; }
  .fsbtn:active { background: var(--row-hover); }
  .fsbtn svg.i { width: 22px; height: 22px; }
  .fsveil { position: fixed; inset: 0; z-index: 11; background: rgba(11,11,14,0.9); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-size: 17px; font-weight: 600; }
  .fsveil[hidden] { display: none; }
  .fsveil svg.i { width: 64px; height: 64px; color: var(--muted); }
  .fsveil .sub { font-size: 13px; font-weight: 400; }
  .lockopt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 6px 4px; text-align: left; }
  .lockopt .tx { flex: 1; min-width: 0; }
  .lockopt .sub { white-space: normal; }
  .switch { width: 46px; height: 28px; border-radius: 14px; background: rgba(255,255,255,0.18); position: relative; flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); transition: left .2s; }
  .lockopt.on .switch { background: var(--sel-bg); }
  .lockopt.on .switch::after { left: 21px; background: var(--sel-text); }
  .timeropt.on .name { color: var(--msg); }
  .toast { position: fixed; left: 50%; bottom: calc(var(--mini-h) + 22px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--sel-bg); color: var(--sel-text); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 10;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast.show { opacity: .97; }
</style>
</head>

<main>
  <div class="panel" id="panel">
    <div class="ptitle">
      <button class="back" id="back" hidden aria-label="Volver"><svg class="i"><use href="#i-back"/></svg></button>
      <h2 id="ptitle">Actividades</h2>
      <span class="pill" id="status">Conectando…</span>
      <button class="fsbtn" id="fs" hidden aria-label="Pantalla completa"><svg class="i"><use href="#i-full"/></svg></button>
    </div>
    <div id="pbody"></div>
  </div>
</main>

<div class="mini" id="mini" hidden>
  <div class="ic" id="miniArt">♪</div>
  <div style="min-width:0"><div class="t1" id="miniTitle"></div><div class="t2" id="miniSub"></div></div>
  <button id="miniPP" aria-label="Play o pausa"><svg class="i"><use href="#i-play"/></svg></button>
  <button id="miniNext" aria-label="Siguiente"><svg class="i"><use href="#i-next"/></svg></button>
  <div class="prog" id="miniProg"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="fsveil" id="fsveil" hidden><svg class="i"><use href="#i-full"/></svg>Tocá para pantalla completa<span class="sub">Se saca con el botón de arriba a la derecha</span></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let state = null, stateAt = 0, failures = 0, pollTimer = null;

// ---------------------------------------------------------------- utilidades
function toast(text, ms = 2400) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), ms);
}
function buzz() { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function svg(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", "i");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", "#i-" + name);
  s.appendChild(u);
  return s;
}
function setIcon(btn, name) {
  if (btn.dataset.icon === name) return;
  btn.dataset.icon = name;
  btn.querySelector("use").setAttribute("href", "#i-" + name);
}
function fmt(s) {
  if (!s || s < 0) return "0:00";
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
}
async function post(path, body, quiet) {
  try {
    const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Tele-CEC": "1"},
                                 body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) toast(j.error || j.message || "No se pudo", 3200);
    else if (j.message && !quiet) toast(j.message);
    return j;
  } catch (e) {
    toast("Sin conexión con la Pi");
    return {ok: false};
  } finally {
    schedule(300);
  }
}
async function get(path) {
  try {
    const r = await fetch(path, {cache: "no-store"});
    return await r.json();
  } catch (e) {
    return {error: "Sin conexión con la Pi"};
  }
}

// ---------------------------------------------------------------- filas, como en el panel de la TV
function icon(item, round) {
  const ic = el("div", "ic" + (round ? " round" : ""));
  if (item.icon) { const img = el("img"); img.src = item.icon; img.alt = ""; ic.appendChild(img); }
  else if (item.img) ic.style.backgroundImage = `url("${item.img}")`;
  else if (item.glyph) ic.appendChild(svg(item.glyph));
  else ic.textContent = (item.name || item.title || "?").slice(0, 1);
  return ic;
}
function row(item, onTap, opts = {}) {
  const r = el("button", "row" + (item.enabled === false ? " off" : "") + (item.current ? " cur" : ""));
  r.appendChild(icon(item, opts.round));
  const tx = el("div", "tx");
  const name = el("div", "name");
  name.appendChild(el("span", "", item.name || item.title || ""));
  if (item.badge || (item.current && opts.badges !== false)) name.appendChild(el("span", "badge", item.badge || "en uso"));
  tx.appendChild(name);
  if (item.sub) tx.appendChild(el("div", "sub", item.sub));
  r.appendChild(tx);
  if (opts.chip) {
    const c = el("span", "chip", opts.chip + " ▸");
    c.addEventListener("click", (ev) => { ev.stopPropagation(); buzz(); opts.onChip(); });
    r.appendChild(c);
  } else if (opts.more) {
    const m = el("span", "more", "⋯");
    m.addEventListener("click", (ev) => { ev.stopPropagation(); opts.more(); });
    r.appendChild(m);
  } else r.appendChild(el("span"));
  r.addEventListener("click", () => { buzz(); onTap && onTap(item); });
  return r;
}
function note(text, button) {
  const d = el("div", "note", text);
  if (button) { d.appendChild(el("br")); d.appendChild(button); }
  return d;
}
// Una hoja que sube desde abajo (el reproductor, las opciones). Se cierra con ⌄, tocando o bajando la barrita de
// arriba, tocando afuera o con el «atrás» del celular: cada hoja abierta es un paso más en el historial.
const sheets = [];
function sheet(build, onClose) {
  buzz();
  const bg = el("div", "sheet-bg");
  const sh = el("div", "sheet");
  const top = el("div", "sheet-top");
  top.appendChild(el("div", "grab"));
  const x = el("button", "sheet-x");
  x.appendChild(svg("down"));
  x.setAttribute("aria-label", "Cerrar");
  top.appendChild(x);
  sh.appendChild(top);
  let open = true;
  const remove = () => {  // sacarla de la pantalla (el historial ya volvió o va a volver)
    if (!open) return false;
    open = false;
    bg.remove();
    sheets.splice(sheets.indexOf(close), 1);
    if (onClose) onClose();
    return true;
  };
  const close = () => remove() ? historyBack() : Promise.resolve();
  close.remove = remove;
  sheets.push(close);
  history.pushState({sheet: true}, "");
  build(sh, close);
  bg.appendChild(sh);
  bg.addEventListener("click", (ev) => { if (ev.target === bg) close(); });
  x.addEventListener("click", (ev) => { ev.stopPropagation(); buzz(); close(); });
  // Arrastrar la barrita hacia abajo: pasado un poco, se cierra; si no, vuelve a su lugar. Un toque también cierra.
  let y0 = null, dy = 0;
  top.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest(".sheet-x")) return;
    y0 = ev.clientY; dy = 0; sh.classList.add("dragging");
    try { top.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  top.addEventListener("pointermove", (ev) => {
    if (y0 == null) return;
    dy = Math.max(0, ev.clientY - y0);
    sh.style.transform = `translateY(${dy}px)`;
  });
  const end = () => {
    if (y0 == null) return;
    y0 = null; sh.classList.remove("dragging");
    if (dy > 80 || dy < 6) { buzz(); close(); } else sh.style.transform = "";
  };
  top.addEventListener("pointerup", end);
  top.addEventListener("pointercancel", () => { y0 = null; sh.classList.remove("dragging"); sh.style.transform = ""; });
  document.body.appendChild(bg);
  return close;
}
// Volver un paso en el historial y esperar a que el navegador lo haga (es asíncrono): lo que venga después, como
// abrir otra página, recién entonces agrega su propio paso.
const backWaiters = [];
function historyBack() {
  return new Promise((resolve) => {
    let done = false;
    const fin = () => { if (!done) { done = true; resolve(); } };
    backWaiters.push(fin);
    history.back();
    setTimeout(() => { const i = backWaiters.indexOf(fin); if (i >= 0) backWaiters.splice(i, 1); fin(); }, 600);
  });
}
// El «atrás» del celular (o del navegador): cierra la hoja de arriba o vuelve a la página anterior.
window.addEventListener("popstate", () => {
  if (backWaiters.length) { backWaiters.shift()(); return; }
  if (sheets.length) { sheets[sheets.length - 1].remove(); return; }
  if (stack.length > 1) { stack.pop(); render(); }
});
function optionsSheet(title, sub, options) {
  sheet((sh, close) => {
    sh.appendChild(el("div", "np-title", title));
    if (sub) sh.appendChild(el("div", "np-sub", sub));
    const box = el("div", "opts");
    options.forEach(([label, fn]) => {
      const b = el("button", "", label);
      b.addEventListener("click", async () => { buzz(); await close(); await fn(); });
      box.appendChild(b);
    });
    const c = el("button", "", "Cancelar");
    c.addEventListener("click", close);
    box.appendChild(c);
    sh.appendChild(box);
  });
}

// ---------------------------------------------------------------- páginas (una pila, como el panel de la TV)
const stack = [];
function show(page) {
  stack.push(page);
  history.pushState({page: stack.length}, "");
  render();
}
function back() {  // como el «atrás» del celular: el popstate saca la página
  if (stack.length > 1) history.back();
}
function render() {
  const page = stack[stack.length - 1];
  $("back").hidden = stack.length <= 1;
  $("ptitle").textContent = page.title || "";
  page.render($("pbody"), page);
  window.scrollTo(0, 0);
  fit();
}
// Actividades (y un grupo) entran en la pantalla sin scroll: se prueba con las filas normales y, si sobra
// contenido, con las más apretadas. Las demás páginas (listas largas) quedan como siempre.
function fit() {
  const panel = $("panel"), top = stack[stack.length - 1];
  const dense = [1, 2, 3].map((n) => "dense-" + n);
  panel.classList.remove(...dense);
  if (!(top === ACTIVITIES || (top && top.group))) return;
  const over = () => document.documentElement.scrollHeight > window.innerHeight + 1;
  for (const cls of dense) {  // se suman: dense-2 es dense-1 y un poco más
    if (!over()) return;
    panel.classList.add(cls);
  }
}
let fitTimer = null;
window.addEventListener("resize", () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 150); });
function retitle(page, title) {
  page.title = title;
  if (stack[stack.length - 1] === page) $("ptitle").textContent = title;
}
$("back").addEventListener("click", () => { buzz(); back(); });

async function openApp(item, extra) {
  toast(`Abriendo ${item.name}…`, 15000);
  const r = await post("/api/app", Object.assign({id: item.id}, extra || {}), true);
  if (r.ok) { toast(r.message || `${item.name} en la TV`); refreshMenu(); }
  return r;
}
async function closeApp(item) {
  toast(`Cerrando ${item.name}…`, 10000);
  const r = await post("/api/close", {id: item.id});
  refreshMenu();

}

// Actividades: las mismas filas que el menú de la TV. Tocar = OK en la TV; el botoncito = sus opciones.
const ACTIVITIES = {
  title: "Actividades",
  render(body, page) {
    if (!page.data) { body.replaceChildren(note("Cargando…")); refreshMenu(); return; }
    body.replaceChildren(activityRows(page.data.items));
  },
};
function activityRows(items) {
  const rows = el("div", "rows");
  items.forEach((it) => {
    const opts = {};
    if (it.option === "sound") { rows.appendChild(soundRow(it)); return; }
    if (it.option && it.option !== "group") { opts.chip = it.chip; opts.onChip = () => openOption(it); }
    rows.appendChild(row(it, () => tapActivity(it), opts));
  });
  return rows;
}
// Un grupo del menú («Videos y música»): las actividades de adentro, con lo último que mandó la Pi.
function groupPage(group) {
  return {
    title: group.name, group: group.id,
    render(body) {
      const fresh = ((ACTIVITIES.data || {}).items || []).find((x) => x.id === group.id) || group;
      body.replaceChildren(activityRows(fresh.children || []));
    },
  };
}
async function refreshMenu() {
  const r = await get("/api/menu");
  if (r.error || !r.items) return;
  const key = JSON.stringify(r.items);
  if (ACTIVITIES.key === key) return;
  ACTIVITIES.key = key;
  ACTIVITIES.data = r;
  const top = stack[stack.length - 1];
  if (top === ACTIVITIES || (top && top.group)) render();
}
function tapActivity(it) {
  if (it.children) return show(groupPage(it));
  if (it.option === "sound") return openOption(it);
  if (!it.enabled && it.option) return openOption(it);  // sin contenido: elegir otra carpeta o conectar
  if (!it.enabled) { toast(it.sub || "No disponible"); return; }
  if (it.current) {
    const options = [];
    if (it.option) options.push([it.chip, () => openOption(it)]);
    if (it.id === "fotos") options.push(["♥ Guardar esta foto en Favoritas", async () => {
      const r = await post("/api/fotos/favorite", {});
      if (r.ok) toast(r.message);
    }]);
    options.push([`Cerrar ${it.name}`, () => closeApp(it)]);
    optionsSheet(`${it.name} está en la TV`, it.sub, options);
    return;
  }
  if (it.option === "games") return openOption(it);  // Juegos: siempre elegir cuál (no hay uno por defecto)
  if (it.browse && !it.running && it.option === "folders") return show(folderPage(it, "", true));  // Videos: qué ver
  if (it.browse && !it.running && it.option) return openOption(it);  // Música: Explorar
  openApp(it);
}
function openOption(it) {
  if (it.option === "folders") show(folderPage(it, ""));
  else if (it.option === "games") show(gamesPage(it));
  else if (it.option === "android") show(androidPage(it));
  else if (it.option === "tidal") show(TIDAL);
  else if (it.option === "music") show(MUSIC);
  else if (it.option === "search") show(searchPage(it));
  else if (it.option === "sound") show(SOUND);
  else if (it.option === "radio") show(radioPage(it));
  else if (it.option === "sites") show(sitesPage(it));
}

// Sonido: la barra de volumen (tocar o arrastrar) con el silencio al lado.
let volHold = 0;  // mientras se arrastra (y un ratito después) la barra no salta con lo que dice la Pi
function volumeBox(cls) {
  const box = el("div", "vs" + (cls ? " " + cls : ""));
  box.dataset.vol = "1";
  const bar = el("div", "vbar");
  const trk = el("div", "tr");
  trk.appendChild(el("i"));
  bar.append(trk, el("div", "knob"));
  bar.setAttribute("role", "slider");
  bar.setAttribute("aria-label", "Volumen");
  const mute = el("button", "mute");
  mute.appendChild(svg("speaker"));
  mute.setAttribute("aria-label", "Silencio");
  mute.addEventListener("click", () => {
    buzz();
    const muted = !box.classList.contains("muted");
    document.querySelectorAll('[data-vol="1"]').forEach((b) => paintVol(b, null, muted));
    volHold = Date.now() + 1500;
    post("/api/volume", {change: "mute"}, true);
  });
  box.append(bar, el("span", "num", "–"), mute);
  let sent = -1, want = -1, timer = null;
  const send = () => {
    clearTimeout(timer);
    timer = null;
    if (want < 0 || want === sent) return;
    sent = want;
    post("/api/volume", {level: want}, true);
  };
  const at = (ev) => {
    const r = bar.getBoundingClientRect();
    return Math.round(100 * Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)));
  };
  const move = (ev) => {
    want = at(ev);
    volHold = Date.now() + 1500;
    document.querySelectorAll('[data-vol="1"]').forEach((b) => paintVol(b, want, false));
    if (!timer) timer = setTimeout(send, 150);  // mientras se arrastra, como mucho unas 7 veces por segundo
  };
  bar.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    bar.setPointerCapture(ev.pointerId);
    sent = -1;
    move(ev);
  });
  bar.addEventListener("pointermove", (ev) => { if (bar.hasPointerCapture(ev.pointerId)) move(ev); });
  ["pointerup", "pointercancel"].forEach((e) => bar.addEventListener(e, () => { send(); volHold = Date.now() + 1500; }));
  bar.addEventListener("click", (ev) => ev.stopPropagation());
  return box;
}
// level null: solo el silencio. Sin dato (undefined, o null de la Pi) se queda con el último que se supo: una barra
// recién armada no arranca en 0 (parecería «sin volumen»).
let lastVol = null;
function paintVol(box, level, muted) {
  box.classList.toggle("muted", !!muted);
  setIcon(box.querySelector(".mute"), muted ? "mute" : "speaker");
  if (typeof level === "number") lastVol = level;
  else if (level === null && box.dataset.painted) return;
  else level = lastVol;
  box.dataset.painted = "1";
  const p = level == null ? 0 : Math.max(0, Math.min(100, level));
  box.querySelector(".tr > i").style.width = p + "%";
  box.querySelector(".knob").style.left = p + "%";
  box.querySelector(".num").textContent = level == null ? "–" : level + "%";
  box.querySelector(".vbar").setAttribute("aria-valuenow", String(p));
}
// La fila «Sonido» de Actividades: tocarla elige por dónde sale; abajo, el volumen y el silencio.
function soundRow(it) {
  const box = el("div", "sndrow");
  const vol = volumeBox();
  box.append(row(it, () => tapActivity(it), {}), vol);
  const v = (state && state.volume) || {};
  paintVol(vol, v.level, v.muted);
  return box;
}
const SOUND = {
  title: "Sonido",
  render(body) {
    const outs = el("div", "rows");
    outs.id = "outs";
    body.replaceChildren(volumeBox("big"), timerOption(), el("div", "sect", "Sale por"), outs);
    SOUND.key = null;
    renderSound();
  },
};
function renderSound() {
  if (!state) return;
  const v = state.volume || {};
  if (Date.now() > volHold) document.querySelectorAll('[data-vol="1"]').forEach((b) => paintVol(b, v.level, v.muted));
  const outs = $("outs");
  if (!outs) return;
  const key = JSON.stringify(state.outputs);
  if (SOUND.key === key) return;

  return n.length ? Math.min(pos, n.length) : pos;
}

  else { node.style.backgroundImage = ""; node.dataset.src = ""; node.textContent = "♪"; }
}

// El reproductor grande: tapa, barra (tocar o arrastrar), ⏮ ⏯ ⏭, aleatorio, repetir, ♥ y volumen.
const player = {};
function openPlayer() {
  if (!state || !state.now || player.close) return;
  const closeSheet = sheet((sh) => {
    const art = el("div", "big-art");
    const head = el("div", "np-head");
    const tx = el("div", "tx");
    const title = el("div", "np-title"), sub = el("div", "np-sub"), from = el("div", "np-from");
    tx.append(title, sub, from);
    const like = el("button", "like");
    like.appendChild(svg("heart-o"));
    like.addEventListener("click", async () => { buzz(); const r = await media("like"); if (r && r.ok) { state.now.liked = !state.now.liked; player.update(); } });
    head.append(tx, like);
    const seek = el("div", "seek");
    const trk = el("div", "tr");
    const fill = el("i");
    trk.appendChild(fill);
    const knob = el("div", "knob");
    seek.append(trk, knob);
    const times = el("div", "times");
    const pos = el("span"), len = el("span");
    times.append(pos, len);
    const tr = el("div", "transport");
    const btn = (name, cls, fn, aria) => { const b = el("button", cls || ""); b.appendChild(svg(name)); b.setAttribute("aria-label", aria); b.addEventListener("click", () => { buzz(); fn(); }); return b; };
    const shuf = btn("shuffle", "small", () => media("shuffle"), "Aleatorio");
    const loop = btn("repeat", "small", () => media("loop"), "Repetir: la lista, el tema o nada");
    const one = el("span", "one", "1");
    loop.appendChild(one);
    const pp = btn("play", "main", () => media("play-pause"), "Play o pausa");
    tr.append(shuf, btn("prev", "", () => media("previous"), "Anterior"), pp, btn("next", "", () => media("next"), "Siguiente"), loop);
    sh.append(art, head, seek, times, tr, volumeBox("big"), timerOption());
    if (lockSupported()) sh.append(lockOption());

    let dragging = false, frac = 0;
    const showPos = (p, l) => {
      const pct = l ? 100 * p / l : 0;
      fill.style.width = pct + "%"; knob.style.left = pct + "%"; knob.hidden = !l;
      pos.textContent = fmt(p); len.textContent = l ? fmt(l) : "";
    };
    const at = (ev) => { const r = seek.getBoundingClientRect(); return Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)); };
    seek.addEventListener("pointerdown", (ev) => {
      const n = state && state.now; if (!n || !n.length) return;
      dragging = true; seek.setPointerCapture(ev.pointerId); frac = at(ev); showPos(frac * n.length, n.length);
    });
    seek.addEventListener("pointermove", (ev) => { if (dragging && state.now) { frac = at(ev); showPos(frac * state.now.length, state.now.length); } });
    seek.addEventListener("pointerup", async () => {
      if (!dragging || !state.now) { dragging = false; return; }
      dragging = false; buzz();
      const n = state.now; n.position = frac * n.length; stateAt = Date.now();
      await media("seek", frac * n.length);
    });
    seek.addEventListener("pointercancel", () => { dragging = false; });

    player.tick = () => { if (!dragging && state && state.now) showPos(curPos(), state.now.length); };
    player.update = () => {
      const n = state && state.now;
      if (!n) return;
      title.textContent = n.title || "(sin título)";
      sub.textContent = [n.artist, n.album].filter(Boolean).join(" · ");
      from.textContent = n.app + (n.status === "Paused" ? " · en pausa" : "");
      setArt(art, n.art);
      setIcon(pp, n.status === "Playing" ? "pause" : "play");
      like.hidden = !(n.tidal && n.liked != null);
      like.classList.toggle("on", !!n.liked);
      setIcon(like, n.liked ? "heart" : "heart-o");
      shuf.style.visibility = n.shuffle == null ? "hidden" : "";
      shuf.classList.toggle("on", !!n.shuffle);
      loop.style.visibility = n.loop ? "" : "hidden";
      loop.classList.toggle("on", n.loop === "Playlist" || n.loop === "Track");
      one.hidden = n.loop !== "Track";
      renderSound();
      player.tick();
    };
  }, () => { player.tick = player.update = player.close = null; });
  player.close = closeSheet;
  player.update();
}

// ---------------------------------------------------------------- estado
async function poll() {
  pollTimer = null;
  // Con la pantalla apagada solo se sigue consultando si están los controles de la pantalla bloqueada.
  if (document.visibilityState !== "visible" && !lockActive()) return;
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    stateAt = Date.now();
    failures = 0;
    checkVersion(state.ui);
  } catch (e) {
    if (++failures === 2) toast("Sin conexión con la Pi", 3000);
    if (failures >= 2) state = null;
  }
  renderStatus();
  renderMini();
  renderSound();
  renderLock();
  lockStatus();
  renderTimer();
  const top = stack[stack.length - 1];
  if (top === ACTIVITIES && Date.now() - (poll.menuAt || 0) > 4000) { poll.menuAt = Date.now(); refreshMenu(); }
  if (top === TIDAL && tView.kind === "queue" && state && state.now && state.now.title !== lastQueueTitle) tidalQueue(true);
  if (top === MUSIC && mView.kind === "queue" && Date.now() - (poll.queueAt || 0) > 3000) { poll.queueAt = Date.now(); musicQueue(true); }
  schedule(state ? 1500 : 4000);
}
// Se instaló otra versión en la Pi: la página abierta se recarga sola (si no se está escribiendo algo).
function checkVersion(ui) {
  if (!ui) return;
  if (!checkVersion.seen) { checkVersion.seen = ui; return; }
  if (ui === checkVersion.seen) return;
  const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  // con la pantalla apagada no: se cortarían los controles de la pantalla bloqueada (se recarga al volver)
  if (!typing && document.visibilityState === "visible") location.reload();
}
function renderStatus() {
  const s = state, st = $("status");
  st.className = "pill";
  if (!s) { st.textContent = "Sin conexión"; return; }
  if (s.asleep) { st.textContent = "En reposo"; st.classList.add("sleep"); }
  else st.textContent = s.app && s.app.name ? "En la TV: " + s.app.name : (s.menu ? "Menú en la TV" : "Nada abierto");
}
function schedule(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }

// ---------------------------------------------------------------- temporizador para apagar
// En 15, 30… minutos o al terminar el tema: baja el volumen, pausa y la Pi entra en reposo (y apaga la TV).
const TIMER_CHOICES = [[15, "En 15 minutos"], [30, "En 30 minutos"], [45, "En 45 minutos"], [60, "En 1 hora"],
                       [90, "En 1 hora y media"], ["track", "Al terminar este tema o video"]];
function timerText() {
  const t = state && state.sleep;
  if (!t) return "Baja el volumen, pausa y apaga la tele";
  if (t.mode === "track") return "Se apaga al terminar este tema";
  const left = Math.max(0, t.left - (Date.now() - stateAt) / 1000), m = Math.round(left / 60);
  return left < 60 ? "Se apaga en menos de un minuto"
    : m >= 60 ? `Se apaga en ${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min` : `Se apaga en ${m} min`;
}
function timerOption() {
  const b = el("button", "lockopt timeropt");
  const tx = el("div", "tx");
  tx.append(el("div", "name", "Temporizador para apagar"), el("div", "sub", timerText()));
  b.append(tx, el("span", "chip", "Elegir ▸"));
  b.addEventListener("click", () => {
    const opts = TIMER_CHOICES.map(([c, label]) => [label, () => setTimer(c)]);
    if (state && state.sleep) opts.push(["Sacar el temporizador", () => setTimer(0)]);
    optionsSheet("Temporizador para apagar", timerText(), opts);
  });
  b.classList.toggle("on", !!(state && state.sleep));
  return b;
}
async function setTimer(choice) {
  const r = await post("/api/sleep", {choice}, true);
  if (r.ok) toast(r.message);
}
function renderTimer() {
  document.querySelectorAll(".timeropt").forEach((b) => {
    b.querySelector(".sub").textContent = timerText();
    b.classList.toggle("on", !!(state && state.sleep));
  });
}

// ---------------------------------------------------------------- pantalla bloqueada y notificación
// Los controles de música del sistema (en la notificación y con la pantalla bloqueada: tapa, tema, ⏮ ⏯ ⏭ y la
// barra) manejan lo que suena en la Pi. El navegador los muestra solo mientras la página reproduce algo: un sonido
// que no se oye, en bucle. Se prende a mano (en el reproductor grande) porque toma el audio del celular: pausaría otra música
// que suene en el teléfono. Las teclas de volumen siguen siendo las del celular (el navegador no se las pasa a la página).
const LOCK = {audio: null, key: "", on: false, err: ""};
try { LOCK.on = localStorage.getItem("tele-cec-lock") === "1"; } catch (e) {}
function lockSupported() { return "mediaSession" in navigator && typeof MediaMetadata !== "undefined"; }
function lockActive() { return LOCK.on && !!LOCK.audio && !LOCK.audio.paused; }
function silentWav(seconds, rate) {
  const n = seconds * rate, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE"); str(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, n * 2, true);
  // Un soplido a −66 dB: no se oye, pero Firefox lo toma por sonido (con menos de ±6 no muestra los controles).
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.round((Math.random() * 2 - 1) * 16), true);
  return URL.createObjectURL(new Blob([buf], {type: "audio/wav"}));
}
function lockSetup() {
  if (LOCK.audio || !lockSupported()) return;
  LOCK.audio = new Audio(silentWav(10, 8000));
  LOCK.audio.loop = true;
  // Firefox recién toma la página como reproductor un momento después de que empieza a sonar (y no se queda con
  // el tema cargado antes): se lo vuelve a pasar.
  LOCK.audio.addEventListener("playing", () => setTimeout(() => { LOCK.key = ""; renderLock(); }, 2000));
  LOCK.audio.addEventListener("playing", () => { lockReport("sonando el audio de fondo"); lockStatus(); });
  LOCK.audio.addEventListener("pause", () => lockStatus());
  const ms = navigator.mediaSession;
  const on = (name, fn) => { try { ms.setActionHandler(name, fn); } catch (e) {} };
  const nudge = (secs) => media("seek", Math.max(0, curPos() + secs));
  on("play", () => media("play"));
  on("pause", () => media("pause"));
  on("stop", () => media("pause"));
  on("previoustrack", () => media("previous"));
  on("nexttrack", () => media("next"));
  on("seekto", (d) => { if (d && d.seekTime != null) media("seek", d.seekTime); });
  on("seekbackward", (d) => nudge(-((d && d.seekOffset) || 10)));
  on("seekforward", (d) => nudge((d && d.seekOffset) || 10));
}
// Arranca el sonido mudo: la primera vez necesita un toque en la página (el navegador no deja sonar solo).
function lockStart() {
  if (!LOCK.on || !lockSupported()) return;
  lockSetup();
  if (state && state.now && state.now.title && LOCK.audio.paused) {
    LOCK.audio.play().then(() => { LOCK.err = ""; renderLock(); lockStatus(); })
      .catch((e) => { LOCK.err = e.name || "error"; lockReport("el audio de fondo no arrancó: " + LOCK.err); lockStatus(); });
  }
}
// Le cuenta a la Pi qué pasa (queda en su registro): sin eso no hay forma de ver qué hace el navegador del celular.
function lockReport(msg) {
  const ua = navigator.userAgent, m = ua.match(/(Firefox|Chrome|Safari)\/[\d]+/);
  post("/api/client-log", {msg: `pantalla bloqueada: ${msg} (${m ? m[0] : "?"}${/Android/.test(ua) ? " Android" : ""})`}, true);
}
function lockStatusText() {
  if (!LOCK.on) return "Los controles de la música en la notificación y con el celular bloqueado";
  if (LOCK.err) return `El navegador no dejó arrancar (${LOCK.err}): tocá acá abajo de nuevo`;
  if (!state || !state.now || !state.now.title) return "Prendido: aparece cuando suena algo en la Pi";
  return lockActive() ? "Prendido: bloqueá el celular o mirá las notificaciones" : "Prendido: tocá la pantalla para que arranque";
}
function lockStatus() {
  document.querySelectorAll(".lockopt .sub").forEach((n) => { n.textContent = lockStatusText(); });
}
function lockStop() {
  if (LOCK.audio && !LOCK.audio.paused) LOCK.audio.pause();
  if (lockSupported()) {
    navigator.mediaSession.metadata = null;
    navigator.mediaSession.playbackState = "none";
  }
  LOCK.key = "";
}
function renderLock() {
  if (!LOCK.audio || (LOCK.on && !state)) return;  // sin conexión un momento: se queda como estaba
  const n = state && state.now;
  if (!LOCK.on || !n || !n.title) { lockStop(); return; }
  if (LOCK.audio.paused) { LOCK.audio.play().catch(() => {}); }
  const ms = navigator.mediaSession;
  const key = [n.title, n.artist, n.album, n.art, n.app].join("\u001f");
  if (key !== LOCK.key) {
    LOCK.key = key;
    const artwork = n.art && !n.art.startsWith("file:")
      ? [{src: new URL(n.art, location.href).href, sizes: "512x512"}] : [];
    ms.metadata = new MediaMetadata({title: n.title, artist: n.artist || "", album: n.album || n.app || "", artwork});
  }
  ms.playbackState = n.status === "Playing" ? "playing" : "paused";
  if (ms.setPositionState) {
    try {
      if (n.length > 0) ms.setPositionState({duration: n.length, position: Math.min(n.length, curPos()), playbackRate: 1});
      else ms.setPositionState();
    } catch (e) {}
  }
}
function lockOption() {
  const b = el("button", "lockopt" + (LOCK.on ? " on" : ""));
  const tx = el("div", "tx");
  tx.append(el("div", "name", "En la pantalla bloqueada"), el("div", "sub", lockStatusText()));
  b.append(tx, el("span", "switch"));
  b.addEventListener("click", () => {
    buzz();
    LOCK.on = !LOCK.on;
    try { localStorage.setItem("tele-cec-lock", LOCK.on ? "1" : "0"); } catch (e) {}
    b.classList.toggle("on", LOCK.on);
    LOCK.err = "";
    if (LOCK.on) { lockReport("prendido"); lockStart(); }
    else { lockStop(); lockReport("apagado"); }
    lockStatus();
  });
  return b;
}
// Prendido de antes: arranca con el primer toque en la página. Al levantar el dedo (click, touchend): al apoyarlo
// (pointerdown) el navegador del celular todavía no lo cuenta como un toque y no deja sonar.
["click", "touchend"].forEach((e) => document.addEventListener(e, () => { if (LOCK.on && !lockActive()) lockStart(); }, true));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") schedule(0); });

// ---------------------------------------------------------------- pantalla completa
// Sin las barras del navegador, como una app. El navegador solo la deja pedir con un toque, y la saca al recargar
// o al volver a abrir la página, o con el «atrás» del celular. Si quedó prendida (el botón de arriba), una cortina
// pide ese toque y se lo come, para que no apriete también lo que esté abajo.
const FS = {on: false};
try { FS.on = localStorage.getItem("tele-cec-fullscreen") === "1"; } catch (e) {}
function fsNow() { return !!document.fullscreenElement; }
function fsEnter() {
  if (fsNow() || !document.fullscreenEnabled) return;
  try {
    const p = document.documentElement.requestFullscreen({navigationUI: "hide"});
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function fsApp() {
  // Abierta desde el ícono como app (sin barras) o sin la función (Safari en el iPhone): no hace falta.
  const app = window.matchMedia && matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
  return !document.fullscreenEnabled || (app && !fsNow());
}
function fsVeil() { $("fsveil").hidden = !(FS.on && !fsNow() && !fsApp()); }
function fsButton() {
  const b = $("fs");
  b.hidden = fsApp();
  b.querySelector("use").setAttribute("href", fsNow() ? "#i-unfull" : "#i-full");
  b.setAttribute("aria-label", fsNow() ? "Salir de pantalla completa" : "Pantalla completa");
}
$("fs").addEventListener("click", (ev) => {
  ev.stopPropagation();
  buzz();
  FS.on = !fsNow();
  try { localStorage.setItem("tele-cec-fullscreen", FS.on ? "1" : "0"); } catch (e) {}
  if (FS.on) { fsEnter(); toast("Pantalla completa: queda así hasta que la saques con este botón"); }
  else if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
});
$("fsveil").addEventListener("click", (ev) => {
  ev.stopPropagation();
  $("fsveil").hidden = true;  // si el navegador no la da, que no quede trabada la página
  fsEnter();
});
document.addEventListener("fullscreenchange", () => { fsButton(); fsVeil(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") fsVeil(); });
fsButton();
fsVeil();

// Arranque: #tidal, #musica o #sonido abren directo esa página.
stack.push(ACTIVITIES);
const start = {tidal: TIDAL, musica: MUSIC, sonido: SOUND, sound: SOUND}[location.hash.slice(1)];
if (start) { stack.push(start); history.pushState({page: 2}, ""); }
render();
poll();
</script>
</body>
</html>
