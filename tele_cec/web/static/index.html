<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Tele-CEC</title>
<style>
  /* Los mismos colores que el panel del menú en la TV (ui/menu_ui.py). */
  :root {
    --bg: #0b0b0e; --panel: rgba(18, 18, 22, 0.94); --panel-solid: #121216; --line: rgba(255, 255, 255, 0.10);
    --text: #f2f2f2; --muted: rgba(242, 242, 242, 0.72); --faint: rgba(242, 242, 242, 0.5);
    --row-hover: rgba(255, 255, 255, 0.07); --sel-bg: #f2f2f2; --sel-text: #111111;
    --badge: rgba(255, 255, 255, 0.16); --chip-line: rgba(255, 255, 255, 0.28); --msg: #ffd166; --heart: #f43f5e;
    --radius: 20px; --mini-h: 68px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(12px, env(safe-area-inset-top)) 14px calc(var(--mini-h) + 24px + env(safe-area-inset-bottom)); }
  main { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: .2px; font-weight: 700; }
  .pill { font-size: 13px; padding: 5px 11px; border-radius: 999px; background: var(--badge); color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62%; }
  .pill.sleep { color: var(--msg); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  [hidden] { display: none !important; }
  svg.i { width: 24px; height: 24px; fill: currentColor; vertical-align: middle; flex: none; }

  /* el panel, como en la TV */
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 12px;
    min-width: 0; }
  .ptitle { display: flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 4px 8px; }
  .ptitle h2 { font-size: 19px; margin: 0; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .back { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; margin-left: -4px; }
  .back:active { background: var(--row-hover); }
  .rows { display: grid; gap: 2px; }
  .row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center;
    padding: 8px 10px; border-radius: 14px; text-align: left; width: 100%; }
  .row:active { background: var(--sel-bg); color: var(--sel-text); }
  .row:active .sub, .row:active .badge, .row:active .chip { color: inherit; }
  .row.off { opacity: .45; }
  .row.cur { background: var(--row-hover); }
  .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; overflow: hidden;
    background: rgba(255,255,255,0.06) center/cover no-repeat; font-weight: 700; font-size: 18px; color: var(--muted); }
  .ic img { width: 100%; height: 100%; object-fit: contain; }
  .ic.round { border-radius: 50%; }
  .tx { min-width: 0; }
  .name { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { flex: none; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; background: var(--badge); }
  .chip { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 10px; border: 2px solid var(--chip-line);
    color: rgba(255,255,255,0.85); white-space: nowrap; }
  .chip:active { background: var(--sel-bg); color: var(--sel-text); border-color: var(--sel-bg); }
  .more { color: var(--faint); font-size: 20px; padding: 0 4px; }
  .note { color: var(--muted); font-size: 14px; padding: 16px 8px; text-align: center; }
  .note .go { margin-top: 12px; }
  .go { background: var(--sel-bg); color: var(--sel-text); font-weight: 700; padding: 11px 16px; border-radius: 12px; }
  .ghost { border: 2px solid var(--chip-line); font-weight: 700; padding: 9px 14px; border-radius: 12px; }
  .go:active, .ghost:active { filter: brightness(.85); }
  .sect { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--faint);
    margin: 14px 10px 4px; }
  input[type=search], input[type=text] { font: inherit; color: var(--text); background: rgba(255,255,255,0.08);
    border: 2px solid transparent; border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; outline: none; }
  input:focus { border-color: rgba(255,255,255,0.4); }
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 0 2px; }
  .hint { color: var(--faint); font-size: 13px; padding: 8px 6px 0; }
  .seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px 0 4px; padding: 0 2px; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: none; padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 600;
    border: 2px solid var(--chip-line); color: var(--muted); }
  .seg button.on { background: var(--sel-bg); color: var(--sel-text); border-color: var(--sel-bg); }
  .detail { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; margin: 4px 6px 8px; }
  .detail .ic { width: 92px; height: 92px; }
  .detail .name { font-size: 18px; }
  .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .loadmore { width: 100%; padding: 12px; color: var(--muted); }

  /* volumen */
  .vol { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px 48px; gap: 10px; align-items: center; padding: 4px 6px 10px; }
  .vol button { height: 46px; border-radius: 12px; background: rgba(255,255,255,0.08); font-size: 22px; }
  .vol .lv { height: 8px; border-radius: 8px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .vol .lv > i { display: block; height: 100%; width: 0; background: var(--text); transition: width .2s; }
  .vol .num { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .vol.muted .lv > i { background: var(--faint); }

  /* reproductor chico (abajo) y grande (hoja) */
  .mini { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); height: var(--mini-h);
    max-width: 500px; margin: 0 auto; background: var(--panel-solid); border: 2px solid var(--line); border-radius: 18px;
    display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px 48px; gap: 10px; align-items: center; padding: 0 10px; z-index: 6;
    box-shadow: 0 8px 30px rgba(0,0,0,.45); overflow: hidden; }
  .mini .ic { width: 48px; height: 48px; border-radius: 10px; }
  .mini .t1 { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .t2 { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini > button { height: 48px; border-radius: 50%; display: grid; place-items: center; }
  .mini > button:active { background: var(--row-hover); }
  .mini .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--text); width: 0; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 9; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--panel-solid); border: 2px solid var(--line); border-bottom: 0; width: 100%; max-width: 500px;
    border-radius: 22px 22px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--badge); margin: 0 auto 12px; }
  .big-art { width: min(72vw, 300px); aspect-ratio: 1; border-radius: 16px; margin: 4px auto 16px; display: grid; place-items: center;
    background: rgba(255,255,255,0.06) center/cover no-repeat; font-size: 64px; color: var(--faint); }
  .np-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; }
  .np-title { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-sub { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-from { color: var(--faint); font-size: 12px; margin-top: 2px; }
  .like { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .like.on { color: var(--heart); }
  .seek { position: relative; height: 28px; margin-top: 10px; touch-action: none; cursor: pointer; }
  .seek .tr { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.14); overflow: hidden; }
  .seek .tr > i { display: block; height: 100%; width: 0; background: var(--text); }
  .seek .knob { position: absolute; top: 7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--text); left: 0; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .transport { display: grid; grid-template-columns: 44px 1fr 72px 1fr 44px; align-items: center; justify-items: center; margin: 10px 0 6px; }
  .transport button { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
  .transport button:active { background: var(--row-hover); }
  .transport .main { width: 70px; height: 70px; background: var(--sel-bg); color: var(--sel-text); }
  .transport .main svg.i { width: 34px; height: 34px; }
  .transport svg.i { width: 30px; height: 30px; }
  .transport .small { width: 44px; height: 44px; color: var(--faint); position: relative; }
  .transport .small svg.i { width: 22px; height: 22px; }
  .transport .small.on { color: var(--text); }
  .transport .small .one { position: absolute; right: 4px; top: 4px; font-size: 10px; font-weight: 800; }
  .opts { display: grid; gap: 6px; margin-top: 12px; }
  .opts button { padding: 14px; text-align: left; border-radius: 12px; background: rgba(255,255,255,0.06); font-weight: 600; }
  .opts button:active { background: var(--sel-bg); color: var(--sel-text); }
  .toast { position: fixed; left: 50%; bottom: calc(var(--mini-h) + 22px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--sel-bg); color: var(--sel-text); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 10;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast.show { opacity: .97; }
</style>
</head>
<body>

<main>
  <header>
    <h1>Tele-CEC</h1>
    <span class="pill" id="status">Conectando…</span>
  </header>
  <div class="panel">
    <div class="ptitle">
      <button class="back" id="back" hidden aria-label="Volver"><svg class="i"><use href="#i-back"/></svg></button>
      <h2 id="ptitle">Actividades</h2>
    </div>
    <div id="pbody"></div>
  </div>
</main>

<div class="mini" id="mini" hidden>
  <div class="ic" id="miniArt">♪</div>
  <div style="min-width:0"><div class="t1" id="miniTitle"></div><div class="t2" id="miniSub"></div></div>
  <button id="miniPP" aria-label="Play o pausa"><svg class="i"><use href="#i-play"/></svg></button>
  <button id="miniNext" aria-label="Siguiente"><svg class="i"><use href="#i-next"/></svg></button>
  <div class="prog" id="miniProg"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let state = null, stateAt = 0, failures = 0, pollTimer = null;

// ---------------------------------------------------------------- utilidades
function toast(text, ms = 2400) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), ms);
}
function buzz() { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function svg(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", "i");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", "#i-" + name);
  s.appendChild(u);
  return s;
}
function setIcon(btn, name) {
  if (btn.dataset.icon === name) return;
  btn.dataset.icon = name;
  btn.querySelector("use").setAttribute("href", "#i-" + name);
}
function fmt(s) {
  if (!s || s < 0) return "0:00";
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
}
async function post(path, body, quiet) {
  try {
    const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Tele-CEC": "1"},
                                 body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) toast(j.error || j.message || "No se pudo", 3200);
    else if (j.message && !quiet) toast(j.message);
    return j;
  } catch (e) {
    toast("Sin conexión con la Pi");
    return {ok: false};
  } finally {
    schedule(300);
  }
}
async function get(path) {
  try {
    const r = await fetch(path, {cache: "no-store"});
    return await r.json();
  } catch (e) {
    return {error: "Sin conexión con la Pi"};
  }
}

// ---------------------------------------------------------------- filas, como en el panel de la TV
function icon(item, round) {
  const ic = el("div", "ic" + (round ? " round" : ""));
  if (item.icon) { const img = el("img"); img.src = item.icon; img.alt = ""; ic.appendChild(img); }
  else if (item.img) ic.style.backgroundImage = `url("${item.img}")`;
  else if (item.glyph) ic.appendChild(svg(item.glyph));
  else ic.textContent = (item.name || item.title || "?").slice(0, 1);
  return ic;
}
function row(item, onTap, opts = {}) {
  const r = el("button", "row" + (item.enabled === false ? " off" : "") + (item.current ? " cur" : ""));
  r.appendChild(icon(item, opts.round));
  const tx = el("div", "tx");
  const name = el("div", "name");
  name.appendChild(el("span", "", item.name || item.title || ""));
  if (item.badge || (item.current && opts.badges !== false)) name.appendChild(el("span", "badge", item.badge || "en uso"));
  tx.appendChild(name);
  if (item.sub) tx.appendChild(el("div", "sub", item.sub));
  r.appendChild(tx);
  if (opts.chip) {
    const c = el("span", "chip", opts.chip + " ▸");
    c.addEventListener("click", (ev) => { ev.stopPropagation(); buzz(); opts.onChip(); });
    r.appendChild(c);
  } else if (opts.more) {
    const m = el("span", "more", "⋯");
    m.addEventListener("click", (ev) => { ev.stopPropagation(); opts.more(); });
    r.appendChild(m);
  } else r.appendChild(el("span"));
  r.addEventListener("click", () => { buzz(); onTap && onTap(item); });
  return r;
}
function note(text, button) {
  const d = el("div", "note", text);
  if (button) { d.appendChild(el("br")); d.appendChild(button); }
  return d;
}
function sheet(build, onClose) {
  buzz();
  const bg = el("div", "sheet-bg");
  const sh = el("div", "sheet");
  sh.appendChild(el("div", "grab"));
  const close = () => { bg.remove(); if (onClose) onClose(); };
  build(sh, close);
  bg.appendChild(sh);
  bg.addEventListener("click", (ev) => { if (ev.target === bg) close(); });
  document.body.appendChild(bg);
  return close;
}
function optionsSheet(title, sub, options) {
  sheet((sh, close) => {
    sh.appendChild(el("div", "np-title", title));
    if (sub) sh.appendChild(el("div", "np-sub", sub));
    const box = el("div", "opts");
    options.forEach(([label, fn]) => {
      const b = el("button", "", label);
      b.addEventListener("click", async () => { close(); buzz(); await fn(); });
      box.appendChild(b);
    });
    const c = el("button", "", "Cancelar");
    c.addEventListener("click", close);
    box.appendChild(c);
    sh.appendChild(box);
  });
}

// ---------------------------------------------------------------- páginas (una pila, como el panel de la TV)
const stack = [];
function show(page) {
  stack.push(page);
  render();
}
function back() {
  if (stack.length > 1) { stack.pop(); render(); }
}
function render() {
  const page = stack[stack.length - 1];
  $("back").hidden = stack.length <= 1;
  $("ptitle").textContent = page.title || "";
  page.render($("pbody"), page);
  window.scrollTo(0, 0);
}
function retitle(page, title) {
  page.title = title;
  if (stack[stack.length - 1] === page) $("ptitle").textContent = title;
}
$("back").addEventListener("click", () => { buzz(); back(); });

async function openApp(item, extra) {
  toast(`Abriendo ${item.name}…`, 15000);
  const r = await post("/api/app", Object.assign({id: item.id}, extra || {}), true);
  if (r.ok) { toast(r.message || `${item.name} en la TV`); refreshMenu(); }
  return r;
}
async function closeApp(item) {
  toast(`Cerrando ${item.name}…`, 10000);
  const r = await post("/api/close", {id: item.id});
  refreshMenu();
  return r;
}

// Actividades: las mismas filas que el menú de la TV. Tocar = OK en la TV; el botoncito = sus opciones.
const ACTIVITIES = {
  title: "Actividades",
  render(body, page) {
    if (!page.data) { body.replaceChildren(note("Cargando…")); refreshMenu(); return; }
    body.replaceChildren(activityRows(page.data.items));
  },
};
function activityRows(items) {
  const rows = el("div", "rows");
  items.forEach((it) => {
    const opts = {};
    if (it.option && it.option !== "sound" && it.option !== "group") { opts.chip = it.chip; opts.onChip = () => openOption(it); }
    rows.appendChild(row(it, () => tapActivity(it), opts));
  });
  return rows;
}

  vol.append(vb("−", "-", "Bajar volumen"), mid, vb("+", "+", "Subir volumen"), vb("🔇", "mute", "Silencio"));

const SOUND = {
  title: "Sonido",

function renderSound() {
  if (!state) return;
  const v = state.volume || {};
  document.querySelectorAll('[data-vol="1"]').forEach((vol) => {
    vol.classList.toggle("muted", !!v.muted);
    vol.querySelector(".lv > i").style.width = (v.level == null ? 0 : Math.min(100, v.level)) + "%";
    vol.querySelector(".num").textContent = v.level == null ? "–" : (v.muted ? "silencio" : v.level + "%");
  });
  const outs = $("outs");
  if (!outs) return;
  const key = JSON.stringify(state.outputs);
  if (SOUND.key === key) return;
  SOUND.key = key;
  outs.replaceChildren(...(state.outputs || []).map((o) => row(
    {name: o.name, sub: o.current ? "Sale por acá" : o.detail, current: o.current, glyph: o.current ? "check" : "speaker"},
    async () => {
      if (o.current) return;
      toast(`Pasando a ${o.name}…`, 15000);
      await post("/api/sound", {id: o.id});
    }, {badges: false})));
}
function holdable(btn) {
  let hold = null, rep = null;
  const fire = () => post("/api/volume", {change: btn.dataset.change}, true);
  const stop = () => { clearTimeout(hold); clearInterval(rep); hold = rep = null; };
  btn.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    buzz();
    fire();
    if (btn.dataset.change !== "mute") hold = setTimeout(() => { rep = setInterval(fire, 180); }, 450);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach((e) => btn.addEventListener(e, stop));
}

async function tidalSearch(q) {
  buzz();
  segOn("");
  tView = {kind: "search", q};

  const r = await get(`/api/tidal/search?q=${encodeURIComponent(q)}`);

  segOn("");

    const rows = el("div", "rows");
    items.forEach((it) => rows.appendChild(itemRow(it, onTap)));
    out.push(rows);
  };
  const prev = {kind: "search", q, result: r};
  const playTrack = (it) => playThis({type: "track", id: it.id}, it.title);
  if (r.top) section("Lo más parecido", [r.top], (it) => it.type === "track" ? playTrack(it) : openDetail(it, prev));
  section("Temas", r.tracks, playTrack);
  section("Artistas", r.artists, (it) => openDetail(it, prev));
  section("Discos", r.albums, (it) => openDetail(it, prev));
  section("Playlists", r.playlists, (it) => openDetail(it, prev));

}

  const nm = el("div", "name");
  nm.appendChild(el("span", "", r.title || item.title));
  tx.appendChild(nm);
  tx.appendChild(el("div", "sub", [r.sub, `${r.total} tema${r.total === 1 ? "" : "s"}`].filter(Boolean).join(" · ")));
  tx.appendChild(playButtons(() => musicPlay({type: item.type, id: item.id, index: 0}, r.title),
                             () => musicPlay({type: item.type, id: item.id, index: Math.floor(Math.random() * Math.max(1, r.total)), shuffle: true}, r.title)));
  head.appendChild(tx);
  const out = [backBtn, head];
  const here = {kind: "detail", item, prev};
  if (r.albums && r.albums.length > 1) {
    out.push(el("div", "sect", "Discos"));
    const al = el("div", "rows");
    r.albums.forEach((a) => al.appendChild(musicRow(a, (x) => musicDetail(x, here))));
    out.push(al, el("div", "sect", "Temas"));
  }
  const rows = el("div", "rows");
  out.push(rows);
  tShow(...out);
  const add = (res) => {
    const start = res.start || 0;
    res.items.forEach((it, i) => rows.appendChild(musicRow(it, (x) => musicPlay({type: item.type, id: item.id, index: start + i}, x.title))));
    const loaded = start + res.items.length;
    if (loaded < res.total) tb().appendChild(moreButton(loaded, res.total, async () => {
      const n = await get(`/api/music/list?type=${item.type}&id=${encodeURIComponent(item.id)}&start=${loaded}`);
      if (!n.error) add(n);
    }));
  };
  add(r);
  window.scrollTo(0, 0);
}
async function musicSearch(q) {
  buzz();
  segOn("");
  mView = {kind: "search", q};
  tShow(note("Buscando…"));
  const r = await get(`/api/music/search?q=${encodeURIComponent(q)}`);
  if (mView.q !== q) return;
  if (r.error) return tShow(note(r.error));
  mView.result = r;
  renderMusicSearch(r, q);
}
function renderMusicSearch(r, q) {
  segOn("");
  const out = [];
  const prev = {kind: "search", q, result: r};
  const section = (title, items, onTap) => {
    if (!items || !items.length) return;
    out.push(el("div", "sect", title));
    const rows = el("div", "rows");
    items.forEach((it) => rows.appendChild(musicRow(it, onTap)));
    out.push(rows);
  };
  section("Temas", r.songs, (it) => musicPlay({type: "song", id: it.id}, it.title));
  section("Artistas", r.artists, (it) => musicDetail(it, prev));
  section("Discos", r.albums, (it) => musicDetail(it, prev));
  if (!out.length) out.push(note(`Nada para «${q}».`));
  tShow(...out);
}
let lastMusicQueue = "";
async function musicQueue(quiet) {
  if (!quiet) tShow(note("Cargando…"));
  const r = await get("/api/music/queue");
  if (mView.kind !== "queue") return;
  if (r.error) return tShow(note(r.error));
  const key = (r.current ? r.current.id : "") + ":" + r.pos + ":" + (r.total_next || 0);
  if (quiet && key === lastMusicQueue) return;  // sin cambios: no la redibuja (no salta el scroll)
  lastMusicQueue = key;
  const out = [];
  if (r.current) {
    out.push(el("div", "sect", "Sonando"));
    const l = el("div", "rows");
    l.appendChild(row(Object.assign(trackItem(r.current), {current: true}), null, {badges: false}));
    out.push(l);
  }
  if (r.next && r.next.length) {
    out.push(el("div", "sect", r.total_next > r.next.length ? `Sigue (${r.total_next} temas)` : "Sigue"));
    const l = el("div", "rows");
    r.next.forEach((it) => l.appendChild(row(trackItem(it), () => post("/api/music/jump", {n: it.n}, true),
                                             {more: it.id ? () => songMenu(it) : null, badges: false})));
    out.push(l);
  }
  if (!out.length) out.push(note(r.closed ? "Música está cerrada. Elegí un artista, un disco o un tema para que suene."
                                          : "La cola está vacía."));
  tShow(...out);
}

// ---------------------------------------------------------------- lo que suena
function curPos() {
  const n = state && state.now;
  if (!n) return 0;
  let pos = n.position || 0;
  if (n.status === "Playing") pos += (Date.now() - stateAt) / 1000;
  return n.length ? Math.min(pos, n.length) : pos;
}
function setArt(node, src) {
  if (src) { if (node.dataset.src !== src) { node.style.backgroundImage = `url("${src}")`; node.dataset.src = src; node.textContent = ""; } }
  else { node.style.backgroundImage = ""; node.dataset.src = ""; node.textContent = "♪"; }
}
function renderMini() {
  const n = state && state.now;
  $("mini").hidden = !n;
  if (!n) { if (player.close) player.close(); return; }
  $("miniTitle").textContent = n.title || "(sin título)";
  $("miniSub").textContent = [n.artist, n.app + (n.status === "Paused" ? " · en pausa" : "")].filter(Boolean).join(" · ");
  setArt($("miniArt"), n.art);
  setIcon($("miniPP"), n.status === "Playing" ? "pause" : "play");
  if (player.update) player.update();
}
function tick() {
  const n = state && state.now;
  if (!n) return;
  $("miniProg").style.width = n.length ? (100 * curPos() / n.length) + "%" : "0";
  if (player.tick) player.tick();
}
setInterval(tick, 500);
function media(command, value) {
  const n = state && state.now;
  if (!n) return;
  return post("/api/media", {command, player: n.player, value}, command !== "like");
}
$("miniPP").addEventListener("click", (ev) => { ev.stopPropagation(); buzz(); media("play-pause"); });
$("miniNext").addEventListener("click", (ev) => { ev.stopPropagation(); buzz(); media("next"); });
$("mini").addEventListener("click", () => openPlayer());

// El reproductor grande: tapa, barra (tocar o arrastrar), ⏮ ⏯ ⏭, aleatorio, repetir, ♥ y volumen.
const player = {};
function openPlayer() {
  if (!state || !state.now || player.close) return;
  const closeSheet = sheet((sh) => {
    const art = el("div", "big-art");
    const head = el("div", "np-head");
    const tx = el("div", "tx");
    const title = el("div", "np-title"), sub = el("div", "np-sub"), from = el("div", "np-from");
    tx.append(title, sub, from);
    const like = el("button", "like");
    like.appendChild(svg("heart-o"));
    like.addEventListener("click", async () => { buzz(); const r = await media("like"); if (r && r.ok) { state.now.liked = !state.now.liked; player.update(); } });
    head.append(tx, like);
    const seek = el("div", "seek");
    const trk = el("div", "tr");
    const fill = el("i");
    trk.appendChild(fill);
    const knob = el("div", "knob");
    seek.append(trk, knob);
    const times = el("div", "times");
    const pos = el("span"), len = el("span");
    times.append(pos, len);
    const tr = el("div", "transport");
    const btn = (name, cls, fn, aria) => { const b = el("button", cls || ""); b.appendChild(svg(name)); b.setAttribute("aria-label", aria); b.addEventListener("click", () => { buzz(); fn(); }); return b; };
    const shuf = btn("shuffle", "small", () => media("shuffle"), "Aleatorio");
    const loop = btn("repeat", "small", () => media("loop"), "Repetir");
    const one = el("span", "one", "1");
    loop.appendChild(one);
    const pp = btn("play", "main", () => media("play-pause"), "Play o pausa");
    tr.append(shuf, btn("prev", "", () => media("previous"), "Anterior"), pp, btn("next", "", () => media("next"), "Siguiente"), loop);
    sh.append(art, head, seek, times, tr, volumeBox());

    let dragging = false, frac = 0;
    const showPos = (p, l) => {
      const pct = l ? 100 * p / l : 0;
      fill.style.width = pct + "%"; knob.style.left = pct + "%"; knob.hidden = !l;
      pos.textContent = fmt(p); len.textContent = l ? fmt(l) : "";
    };
    const at = (ev) => { const r = seek.getBoundingClientRect(); return Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)); };
    seek.addEventListener("pointerdown", (ev) => {
      const n = state && state.now; if (!n || !n.length) return;
      dragging = true; seek.setPointerCapture(ev.pointerId); frac = at(ev); showPos(frac * n.length, n.length);
    });
    seek.addEventListener("pointermove", (ev) => { if (dragging && state.now) { frac = at(ev); showPos(frac * state.now.length, state.now.length); } });
    seek.addEventListener("pointerup", async () => {
      if (!dragging || !state.now) { dragging = false; return; }
      dragging = false; buzz();
      const n = state.now; n.position = frac * n.length; stateAt = Date.now();
      await media("seek", frac * n.length);
    });
    seek.addEventListener("pointercancel", () => { dragging = false; });

    player.tick = () => { if (!dragging && state && state.now) showPos(curPos(), state.now.length); };
    player.update = () => {
      const n = state && state.now;
      if (!n) return;
      title.textContent = n.title || "(sin título)";
      sub.textContent = [n.artist, n.album].filter(Boolean).join(" · ");
      from.textContent = n.app + (n.status === "Paused" ? " · en pausa" : "");
      setArt(art, n.art);
      setIcon(pp, n.status === "Playing" ? "pause" : "play");
      like.hidden = !(n.tidal && n.liked != null);
      like.classList.toggle("on", !!n.liked);
      setIcon(like, n.liked ? "heart" : "heart-o");
      shuf.style.visibility = n.shuffle == null ? "hidden" : "";
      shuf.classList.toggle("on", !!n.shuffle);
      loop.style.visibility = n.loop ? "" : "hidden";
      loop.classList.toggle("on", n.loop === "Playlist" || n.loop === "Track");
      one.hidden = n.loop !== "Track";
      renderSound();
      player.tick();
    };
  }, () => { player.tick = player.update = player.close = null; });
  player.close = closeSheet;
  player.update();
}

// ---------------------------------------------------------------- estado
async function poll() {
  pollTimer = null;
  if (document.visibilityState !== "visible") return;
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    stateAt = Date.now();
    failures = 0;
  } catch (e) {
    if (++failures === 2) toast("Sin conexión con la Pi", 3000);
    if (failures >= 2) state = null;
  }
  renderStatus();
  renderMini();
  renderSound();
  const top = stack[stack.length - 1];
  if (top === ACTIVITIES && Date.now() - (poll.menuAt || 0) > 4000) { poll.menuAt = Date.now(); refreshMenu(); }
  if (top === TIDAL && tView.kind === "queue" && state && state.now && state.now.title !== lastQueueTitle) tidalQueue(true);
  if (top === MUSIC && mView.kind === "queue" && Date.now() - (poll.queueAt || 0) > 3000) { poll.queueAt = Date.now(); musicQueue(true); }
  schedule(state ? 1500 : 4000);
}
function renderStatus() {
  const s = state, st = $("status");
  st.className = "pill";
  if (!s) { st.textContent = "Sin conexión"; return; }
  if (s.asleep) { st.textContent = "En reposo"; st.classList.add("sleep"); }
  else st.textContent = s.app && s.app.name ? "En la TV: " + s.app.name : (s.menu ? "Menú en la TV" : "Nada abierto");
}
function schedule(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") schedule(0); });

// Arranque: #tidal, #musica o #sonido abren directo esa página.
stack.push(ACTIVITIES);
const start = {tidal: TIDAL, musica: MUSIC, sonido: SOUND, sound: SOUND}[location.hash.slice(1)];
if (start) stack.push(start);
render();
poll();
</script>
