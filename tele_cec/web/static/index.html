<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Tele-CEC</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --card2: #232733; --text: #f3f4f6; --muted: #9aa1ad; --line: #2c313d;
    --accent: #818cf8; --accent-ink: #0f1115; --warn: #fbbf24; --heart: #f43f5e;
    --red: #ef4444; --green: #22c55e; --yellow: #eab308; --blue: #3b82f6;
    --radius: 18px; --tabs-h: 64px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f4f6; --card: #ffffff; --card2: #eceef3; --text: #111827; --muted: #5b6270; --line: #dfe2e8;
            --accent: #4f46e5; --accent-ink: #ffffff; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(12px, env(safe-area-inset-top)) 16px calc(var(--tabs-h) + 18px + env(safe-area-inset-bottom)); }
  main { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .tab { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
  section, .tab > * { min-width: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .pill { font-size: 13px; padding: 5px 11px; border-radius: 999px; background: var(--card2); color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
  .pill.on { color: var(--text); }
  .pill.sleep { color: var(--warn); }
  section { background: var(--card); border-radius: var(--radius); padding: 14px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
    margin: 0 0 10px; }
  button { font: inherit; color: inherit; border: 0; background: var(--card2); border-radius: 14px; cursor: pointer;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  button:active, button.down { transform: scale(.96); filter: brightness(1.2); }
  button:disabled { opacity: .4; }
  svg.i { width: 24px; height: 24px; fill: currentColor; vertical-align: middle; }
  [hidden] { display: none !important; }

  /* lo que suena */
  .now { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; }
  .art { width: 72px; height: 72px; border-radius: 12px; background: var(--card2) center/cover no-repeat;
    display: grid; place-items: center; color: var(--muted); font-size: 28px; }
  .meta { min-width: 0; }
  .title { font-weight: 650; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist, .from { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .from { font-size: 12px; margin-top: 2px; }
  .seek { position: relative; height: 26px; margin: 6px 0 0; touch-action: none; cursor: pointer; }
  .seek .bar { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 4px; background: var(--card2); overflow: hidden; }
  .seek .bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
  .seek .knob { position: absolute; top: 6px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
    background: var(--accent); left: 0; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .transport { display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr) 40px; gap: 8px; margin-top: 8px; align-items: center; }
  .transport button { height: 52px; }
  .transport .main { background: var(--accent); color: var(--accent-ink); }
  .transport svg.i { width: 28px; height: 28px; }
  .transport .small { height: 44px; background: transparent; color: var(--muted); position: relative; }
  .transport .small svg.i { width: 22px; height: 22px; }
  .transport .small.on { color: var(--accent); }
  .transport .small .one { position: absolute; right: 6px; top: 6px; font-size: 10px; font-weight: 800; }
  .likebtn { background: transparent; color: var(--muted); width: 40px; height: 40px; border-radius: 50%; }
  .likebtn.on { color: var(--heart); }
  .nowtop { display: flex; align-items: center; justify-content: space-between; }
  .nowtop h2 { margin: 0; }
  .empty { color: var(--muted); font-size: 14px; }

  /* apps */
  .apps { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .apps::-webkit-scrollbar { display: none; }
  .appb { flex: none; width: 74px; display: grid; justify-items: center; gap: 6px; padding: 8px 4px; background: transparent; }
  .appb img, .appb .ph { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--card2); }
  .appb span { font-size: 12px; color: var(--muted); max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .appb.cur span { color: var(--text); font-weight: 650; }
  .appb.cur img { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* control remoto */
  .pad { position: relative; width: min(74vw, 270px); aspect-ratio: 1; margin: 2px auto 14px; border-radius: 50%; background: var(--card2); }
  .pad button { position: absolute; background: transparent; font-size: 26px; color: var(--text); border-radius: 50%; }
  .pad .up    { left: 33%; top: 2%;  width: 34%; height: 30%; }
  .pad .down  { left: 33%; bottom: 2%; width: 34%; height: 30%; }
  .pad .left  { top: 33%; left: 2%;  width: 30%; height: 34%; }
  .pad .right { top: 33%; right: 2%; width: 30%; height: 34%; }
  .pad .ok { left: 32%; top: 32%; width: 36%; height: 36%; background: var(--accent); color: var(--accent-ink);
    font-size: 20px; font-weight: 700; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
  .row { display: grid; gap: 10px; }
  .row3 { grid-template-columns: repeat(3, 1fr); }
  .row4 { grid-template-columns: repeat(4, 1fr); }
  .row button { height: 50px; font-size: 15px; }
  .colors { margin-top: 10px; }
  .colors button { height: 36px; }
  .c-red { background: var(--red); } .c-green { background: var(--green); }
  .c-yellow { background: var(--yellow); } .c-blue { background: var(--blue); }
  .more { margin-top: 10px; }
  .more summary { color: var(--muted); font-size: 14px; cursor: pointer; padding: 6px 2px; list-style: none; }
  .more summary::-webkit-details-marker { display: none; }
  .more summary::before { content: "▸ "; }
  .more[open] summary::before { content: "▾ "; }
  .nums { grid-template-columns: repeat(3, 1fr); margin-top: 8px; }
  .nums button { height: 48px; font-size: 20px; }
  .media { margin-top: 10px; }

  /* escribir */
  .typer { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
  input[type=text], input[type=search] { font: inherit; color: var(--text); background: var(--card2); border: 1px solid transparent;
    border-radius: 12px; padding: 12px; width: 100%; min-width: 0; outline: none; }
  input:focus { border-color: var(--accent); }
  .typer button { padding: 0 14px; height: 48px; }
  .typer .go { background: var(--accent); color: var(--accent-ink); font-weight: 650; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }

  /* tidal */
  .seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px 0 4px; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: none; padding: 8px 12px; border-radius: 999px; font-size: 14px; background: var(--card2); color: var(--muted); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 650; }
  .list { display: grid; gap: 2px; margin-top: 8px; }
  .it { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 4px; border-radius: 12px; }
  .it:active { background: var(--card2); }
  .it .th { width: 48px; height: 48px; border-radius: 8px; background: var(--card2) center/cover no-repeat; display: grid;
    place-items: center; color: var(--muted); }
  .it.artist .th { border-radius: 50%; }
  .it .tx { min-width: 0; }
  .it .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .t2 { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it.na { opacity: .45; }
  .it.cur .t1 { color: var(--accent); }
  .it .add { width: 40px; height: 40px; background: transparent; color: var(--muted); font-size: 22px; }
  .sub { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 14px 4px 2px; }
  .detail-head { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; margin: 8px 0; }
  .detail-head .th { width: 96px; height: 96px; border-radius: 12px; background: var(--card2) center/cover no-repeat; }
  .detail-head .t1 { font-weight: 700; font-size: 18px; }
  .detail-head .t2 { color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { padding: 10px 14px; }
  .actions .go { background: var(--accent); color: var(--accent-ink); font-weight: 650; }
  .back { background: transparent; color: var(--accent); padding: 6px 2px; font-weight: 600; }
  .loadmore { width: 100%; padding: 12px; margin-top: 8px; color: var(--muted); }
  .note { color: var(--muted); font-size: 14px; padding: 18px 4px; text-align: center; }
  .note button { margin-top: 12px; padding: 12px 18px; background: var(--accent); color: var(--accent-ink); font-weight: 650; }
  .searchbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .searchbar button { padding: 0 14px; background: var(--accent); color: var(--accent-ink); font-weight: 650; }

  /* volumen y salidas */
  .vol { display: grid; grid-template-columns: 54px minmax(0, 1fr) 54px 54px; gap: 10px; align-items: center; }
  .vol button { height: 50px; font-size: 22px; }
  .vol .level { height: 8px; border-radius: 8px; background: var(--card2); overflow: hidden; }
  .vol .level > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .vol .num { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .vol.muted .level > i { background: var(--muted); }
  .outs { display: grid; gap: 8px; margin-top: 12px; }
  .out { display: flex; align-items: center; gap: 12px; padding: 12px; text-align: left; width: 100%; }
  .out .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
  .out.cur .dot { border-color: var(--accent); background: radial-gradient(var(--accent) 45%, transparent 50%); }
  .out .name { font-weight: 600; }
  .out .det { font-size: 13px; color: var(--muted); }

  /* pestañas */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabs-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom); background: var(--card); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(3, 1fr); z-index: 5; }
  nav.tabs button { background: transparent; border-radius: 0; display: grid; justify-items: center; align-content: center;
    gap: 2px; font-size: 12px; color: var(--muted); }
  nav.tabs button.on { color: var(--accent); font-weight: 650; }
  nav.tabs svg.i { width: 24px; height: 24px; }

  /* hoja de opciones de un tema */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 9; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 8px; }
  .sheet .t1 { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet .t2 { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .sheet button { padding: 14px; text-align: left; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 10;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast.show { opacity: .95; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-2.5 3.2-1.3-1.6L13.4 6H17V3zM3 6h4.6l9.8 12H17v-3l4 4-4 4v-3h-.6L6.6 8H3V6zm0 12h3.6l2.5-3.2 1.3 1.6L7.6 20H3v-2z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21l-1.5-1.3C5.4 15.1 2 12 2 8.3 2 5.3 4.4 3 7.4 3c1.7 0 3.4.8 4.6 2.1C13.2 3.8 14.9 3 16.6 3 19.6 3 22 5.3 22 8.3c0 3.7-3.4 6.8-8.5 11.4L12 21z"/></symbol>
  <symbol id="i-heart-o" viewBox="0 0 24 24"><path d="M16.6 3c-1.7 0-3.4.8-4.6 2.1C10.8 3.8 9.1 3 7.4 3 4.4 3 2 5.3 2 8.3c0 3.7 3.4 6.8 8.5 11.4L12 21l1.5-1.3C18.6 15.1 22 12 22 8.3 22 5.3 19.6 3 16.6 3zm-4.5 15.2l-.1.1-.1-.1C7.1 14 4 11.2 4 8.3 4 6.3 5.5 4.9 7.4 4.9c1.5 0 3 1 3.5 2.3h2.2c.5-1.3 2-2.3 3.5-2.3 1.9 0 3.4 1.4 3.4 3.4 0 2.9-3.1 5.7-7.9 9.9z"/></symbol>
  <symbol id="i-remote" viewBox="0 0 24 24"><path d="M9 2h6a3 3 0 013 3v14a3 3 0 01-3 3H9a3 3 0 01-3-3V5a3 3 0 013-3zm0 2a1 1 0 00-1 1v14a1 1 0 001 1h6a1 1 0 001-1V5a1 1 0 00-1-1H9zm3 2.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5zM10 14h4v1.6h-4zm0 3h4v1.6h-4z"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l12-3v12.2a3.2 3.2 0 11-2-3V6.6l-8 2V18.2A3.2 3.2 0 119 18z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-5v16l-5-5H3V9zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"/></symbol>
</svg>
<main>
  <header>
    <h1>Tele-CEC</h1>
    <span class="pill" id="app">Conectando…</span>
  </header>

  <section id="nowsec" aria-label="Lo que suena">
    <div class="nowtop"><h2>Sonando</h2>
      <button class="likebtn" id="like" hidden aria-label="Me gusta"><svg class="i"><use href="#i-heart-o"/></svg></button></div>
    <div id="nowbox" hidden>
      <div class="now" style="margin-top:8px">
        <div class="art" id="art">♪</div>
        <div class="meta">
          <div class="title" id="title"></div>
          <div class="artist" id="artist"></div>
          <div class="from" id="from"></div>
        </div>
      </div>
      <div class="seek" id="seek"><div class="bar"><i id="prog"></i></div><div class="knob" id="knob"></div></div>
      <div class="times"><span id="pos"></span><span id="len"></span></div>
      <div class="transport">
        <button class="small" id="shuffle" data-media="shuffle" aria-label="Aleatorio"><svg class="i"><use href="#i-shuffle"/></svg></button>
        <button data-media="previous" aria-label="Anterior"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="main" id="pp" data-media="play-pause" aria-label="Play o pausa"><svg class="i"><use href="#i-play"/></svg></button>
        <button data-media="next" aria-label="Siguiente"><svg class="i"><use href="#i-next"/></svg></button>
        <button class="small" id="loop" data-media="loop" aria-label="Repetir"><svg class="i"><use href="#i-repeat"/></svg><span class="one" id="loop1" hidden>1</span></button>
      </div>
    </div>
    <div class="empty" id="nothing" style="margin-top:6px">No suena nada.</div>
  </section>

  <!-- ===== Control ===== -->
  <div id="tab-control" class="tab">
    <section aria-label="Apps" id="appsec" hidden>
      <h2>Abrir</h2>
      <div class="apps" id="apps"></div>
    </section>
    <section aria-label="Control remoto">
      <h2>Control</h2>
      <div class="pad">
        <button class="up" data-key="UP" data-repeat aria-label="Arriba">▲</button>
        <button class="left" data-key="LEFT" data-repeat aria-label="Izquierda">◀</button>
        <button class="ok" data-key="SELECT">OK</button>
        <button class="right" data-key="RIGHT" data-repeat aria-label="Derecha">▶</button>
        <button class="down" data-key="DOWN" data-repeat aria-label="Abajo">▼</button>
      </div>
      <div class="row row3">
        <button data-key="EXIT">↩ Atrás</button>
        <button data-key="CONTENTS_MENU">☰ Menú</button>
        <button data-key="HELP">? Ayuda</button>
      </div>
      <div class="row row4 colors">
        <button class="c-red" data-key="F2_RED" aria-label="Rojo"></button>
        <button class="c-green" data-key="F3_GREEN" aria-label="Verde"></button>
        <button class="c-yellow" data-key="F4_YELLOW" aria-label="Amarillo"></button>
        <button class="c-blue" data-key="F1_BLUE" aria-label="Azul"></button>
      </div>
      <details class="more">
        <summary>Más teclas</summary>
        <div class="row row4 media">
          <button data-key="REWIND" data-repeat aria-label="Atrasar">⏪</button>
          <button data-key="PAUSE_PLAY_FUNCTION" aria-label="Play o pausa (como el control)">⏯</button>
          <button data-key="STOP" aria-label="Stop">⏹</button>
          <button data-key="FAST_FORWARD" data-repeat aria-label="Adelantar">⏩</button>
        </div>
        <div class="row nums">
          <button data-key="NUMBER1">1</button><button data-key="NUMBER2">2</button><button data-key="NUMBER3">3</button>
          <button data-key="NUMBER4">4</button><button data-key="NUMBER5">5</button><button data-key="NUMBER6">6</button>
          <button data-key="NUMBER7">7</button><button data-key="NUMBER8">8</button><button data-key="NUMBER9">9</button>
          <button data-key="CLEAR" aria-label="Borrar">⌫</button><button data-key="NUMBER0">0</button><span></span>
        </div>
      </details>
    </section>
    <section aria-label="Escribir en la TV">
      <h2>Buscar o escribir en la TV</h2>
      <form class="typer" id="typer" autocomplete="off">
        <input type="text" id="typed" placeholder="Buscar en Netflix o YouTube" enterkeyhint="send">
        <button type="button" id="bksp" aria-label="Borrar en la TV">⌫</button>
        <button type="submit" class="go">Enviar</button>
      </form>
      <div class="hint" id="typeHint"></div>
      <label class="hint" id="typeEnterRow"><input type="checkbox" id="typeEnter" checked> y apretar Enter al final</label>
    </section>
  </div>

  <!-- ===== Tidal ===== -->
  <div id="tab-tidal" class="tab" hidden>
    <section>
      <form class="searchbar" id="tsearch" autocomplete="off">
        <input type="search" id="tq" placeholder="Buscar en Tidal" enterkeyhint="search">
        <button type="submit">Buscar</button>
      </form>
      <div class="seg" id="tseg">
        <button data-lib="tracks" class="on">Mis canciones</button>
        <button data-lib="playlists">Playlists</button>
        <button data-lib="mixes">Mixes</button>
        <button data-lib="albums">Discos</button>
        <button data-lib="artists">Artistas</button>
        <button data-lib="queue">Cola</button>
      </div>
      <div id="tbody"></div>
    </section>
  </div>

  <!-- ===== Sonido ===== -->
  <div id="tab-sound" class="tab" hidden>
    <section aria-label="Sonido">
      <h2>Volumen</h2>
      <div class="vol" id="vol">
        <button data-vol="-" data-repeat aria-label="Bajar volumen">−</button>
        <div><div class="level"><i id="level"></i></div><div class="num" id="volnum">–</div></div>
        <button data-vol="+" data-repeat aria-label="Subir volumen">+</button>
        <button data-vol="mute" id="mute" aria-label="Silencio">🔇</button>
      </div>
      <h2 style="margin-top:18px">Sale por</h2>
      <div class="outs" id="outs"></div>
    </section>
  </div>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="control" class="on"><svg class="i"><use href="#i-remote"/></svg>Control</button>
  <button data-tab="tidal"><svg class="i"><use href="#i-music"/></svg>Tidal</button>
  <button data-tab="sound"><svg class="i"><use href="#i-sound"/></svg>Sonido</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let state = null, stateAt = 0, failures = 0, pollTimer = null, dragging = false;

function toast(text, ms = 2200) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), ms);
}
function buzz() { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function icon(name) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", "i");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", "#i-" + name);
  s.appendChild(u);
  return s;
}
function setIcon(btn, name) {
  if (btn.dataset.icon === name) return;
  btn.dataset.icon = name;
  btn.querySelector("use").setAttribute("href", "#i-" + name);
}

async function post(path, body, quiet) {
  try {
    const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Tele-CEC": "1"},
                                 body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) toast(j.error || j.message || "No se pudo", 3000);
    else if (j.message && !quiet) toast(j.message);
    return j;
  } catch (e) {
    toast("Sin conexión con la Pi");
    return {ok: false};
  } finally {
    schedule(300);
  }
}
async function get(path) {
  try {
    const r = await fetch(path, {cache: "no-store"});
    return await r.json();
  } catch (e) {
    return {error: "Sin conexión con la Pi"};
  }
}

function fmt(s) {
  if (!s || s < 0) return "0:00";
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
}

// ---------------------------------------------------------------- estado
function render() {
  const s = state;
  const app = $("app");
  app.className = "pill";
  if (!s) { app.textContent = "Sin conexión"; return; }
  if (s.asleep) { app.textContent = "En reposo · tocá una tecla"; app.classList.add("sleep"); }
  else if (s.app && s.app.name) { app.textContent = s.app.name + (s.menu ? " · menú" : ""); app.classList.add("on"); }
  else { app.textContent = s.menu ? "Menú" : "Nada abierto"; }

  const n = s.now;
  $("nowbox").hidden = !n;
  $("nothing").hidden = !!n;
  $("like").hidden = !(n && n.tidal && n.liked != null);
  if (n) {
    $("title").textContent = n.title || "(sin título)";
    $("artist").textContent = [n.artist, n.album].filter(Boolean).join(" · ");
    $("from").textContent = n.app + (n.status === "Paused" ? " · en pausa" : n.status === "Stopped" ? " · detenido" : "");
    const art = $("art");
    if (n.art) { if (art.dataset.src !== n.art) { art.style.backgroundImage = `url("${n.art}")`; art.dataset.src = n.art; art.textContent = ""; } }
    else { art.style.backgroundImage = ""; art.dataset.src = ""; art.textContent = "♪"; }
    setIcon($("pp"), n.status === "Playing" ? "pause" : "play");
    $("shuffle").hidden = n.shuffle == null;
    $("shuffle").classList.toggle("on", !!n.shuffle);
    $("loop").hidden = !n.loop;
    $("loop").classList.toggle("on", n.loop === "Playlist" || n.loop === "Track");
    $("loop1").hidden = n.loop !== "Track";
    const like = $("like");
    like.classList.toggle("on", !!n.liked);
    setIcon(like, n.liked ? "heart" : "heart-o");
    progress();
  }

  // apps
  const apps = s.apps || [];
  $("appsec").hidden = !apps.length;
  const akey = JSON.stringify(apps);
  if ($("apps").dataset.key !== akey) {
    $("apps").dataset.key = akey;
    $("apps").replaceChildren(...apps.map((a) => {
      const b = el("button", "appb" + (a.current ? " cur" : ""));
      if (a.icon) { const img = el("img"); img.src = a.icon; img.alt = ""; b.appendChild(img); }
      else b.appendChild(el("div", "ph", a.name.slice(0, 1)));
      b.appendChild(el("span", "", a.name));
      b.addEventListener("click", async () => {
        buzz();
        if (a.current) { toast(`${a.name} ya está abierto`); return; }
        toast(`Abriendo ${a.name}…`, 8000);
        const r = await post("/api/app", {id: a.id}, true);
        if (r.ok) toast(r.message || `${a.name} abierto`);
      });
      return b;
    }));
  }
  const cur = s.app && s.app.id;
  $("typeHint").textContent = !s.text ? "Abrí Netflix o YouTube para buscar."
    : cur === "youtube" ? "Abre la búsqueda de YouTube con ese texto (tarda unos segundos)."
    : cur === "netflix" ? "Busca en Netflix. Si hay un campo para escribir (un PIN), lo escribe ahí."
    : "Lo escribe en la app que está en la TV.";
  $("typeEnterRow").hidden = !s.text || cur === "youtube";

  // sonido
  const v = s.volume || {};
  $("vol").classList.toggle("muted", !!v.muted);
  $("level").style.width = (v.level == null ? 0 : Math.min(100, v.level)) + "%";
  $("volnum").textContent = v.level == null ? "–" : (v.muted ? "silencio" : v.level + "%");
  const outs = $("outs");
  const key = JSON.stringify(s.outputs);
  if (outs.dataset.key !== key) {
    outs.dataset.key = key;
    outs.replaceChildren(...(s.outputs || []).map((o) => {
      const b = el("button", "out" + (o.current ? " cur" : ""));
      b.appendChild(el("span", "dot"));
      const t = el("span");
      t.appendChild(el("div", "name", o.name));
      t.appendChild(el("div", "det", o.current ? "Sale por acá" : o.detail));
      b.appendChild(t);
      b.addEventListener("click", async () => {
        if (o.current) return;
        buzz();
        toast(`Pasando a ${o.name}…`, 8000);
        await post("/api/sound", {id: o.id});
      });
      return b;
    }));
  }
  $("tabs").querySelector('[data-tab="tidal"]').hidden = !s.tidal;
}

function curPos() {
  const n = state && state.now;
  if (!n) return 0;
  let pos = n.position || 0;
  if (n.status === "Playing") pos += (Date.now() - stateAt) / 1000;
  return n.length ? Math.min(pos, n.length) : pos;
}
function progress(force) {
  const n = state && state.now;
  if (!n || (dragging && !force)) return;
  showPos(curPos(), n.length);
}
function showPos(pos, len) {
  const pct = len ? (100 * pos / len) : 0;
  $("prog").style.width = pct + "%";
  $("knob").style.left = pct + "%";
  $("knob").hidden = !len;
  $("pos").textContent = fmt(pos);
  $("len").textContent = len ? fmt(len) : "";
}
setInterval(progress, 500);

// tocar o arrastrar la barra: ir a esa parte del tema
(function () {
  const seek = $("seek");
  const at = (ev) => {
    const r = seek.getBoundingClientRect();
    return Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  };
  let frac = 0;
  seek.addEventListener("pointerdown", (ev) => {
    const n = state && state.now;
    if (!n || !n.length) return;
    dragging = true;
    seek.setPointerCapture(ev.pointerId);
    frac = at(ev);
    showPos(frac * n.length, n.length);
  });
  seek.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    const n = state.now;
    frac = at(ev);
    showPos(frac * n.length, n.length);
  });
  const end = async () => {
    if (!dragging) return;
    dragging = false;
    const n = state && state.now;
    if (!n) return;
    buzz();
    state.now.position = frac * n.length;
    stateAt = Date.now();
    await post("/api/media", {command: "seek", player: n.player, value: frac * n.length}, true);
  };
  seek.addEventListener("pointerup", end);
  seek.addEventListener("pointercancel", () => { dragging = false; progress(true); });
})();

async function poll() {
  pollTimer = null;
  if (document.visibilityState !== "visible") return;
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    stateAt = Date.now();
    failures = 0;
  } catch (e) {
    if (++failures === 2) toast("Sin conexión con la Pi", 3000);
    if (failures >= 2) state = null;
  }
  render();
  if (curTab === "tidal" && tView.kind === "queue" && state && state.now && state.now.title !== lastQueueTitle) {
    lastQueueTitle = state.now.title;
    loadQueue(true);
  }
  schedule(state ? 1500 : 4000);
}
function schedule(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") schedule(0); });

// ---------------------------------------------------------------- botones
function press(btn) {
  if (btn.dataset.key) return post("/api/key", {key: btn.dataset.key});
  if (btn.dataset.vol) return post("/api/volume", {change: btn.dataset.vol});
  if (btn.dataset.media) {
    if (!state || !state.now) return;
    return post("/api/media", {command: btn.dataset.media, player: state.now.player});
  }
}
document.querySelectorAll("[data-key],[data-vol],[data-media]").forEach((btn) => {
  let hold = null, rep = null;
  const stop = () => { clearTimeout(hold); clearInterval(rep); hold = rep = null; btn.classList.remove("down"); };
  btn.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    btn.classList.add("down");
    buzz();
    press(btn);
    if (btn.hasAttribute("data-repeat")) hold = setTimeout(() => { rep = setInterval(() => press(btn), 160); }, 450);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach((e) => btn.addEventListener(e, stop));
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
});
$("like").addEventListener("click", async () => {
  if (!state || !state.now) return;
  buzz();
  const r = await post("/api/media", {command: "like", player: state.now.player});
  if (r.ok) { state.now.liked = !state.now.liked; render(); }
});

// escribir en la TV
$("typer").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = $("typed").value;
  const enter = $("typeEnter").checked;
  if (!text && !enter) return;
  buzz();
  const r = await post("/api/text", {text, key: enter ? "Enter" : ""}, true);
  if (r.ok) { $("typed").value = ""; $("typed").blur(); toast(r.message || "Escrito en la TV"); }
});
$("bksp").addEventListener("click", () => { buzz(); post("/api/text", {key: "BackSpace"}, true); });

// pestañas
let curTab = "control";
function showTab(name) {
  curTab = name;
  document.querySelectorAll(".tab").forEach((t) => { t.hidden = t.id !== "tab-" + name; });
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  try { localStorage.setItem("tab", name); } catch (e) {}
  if (name === "tidal" && !tView.loaded) openLib(tView.kind || "tracks");
}
$("tabs").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-tab]");
  if (b) { buzz(); showTab(b.dataset.tab); window.scrollTo(0, 0); }
});

// ---------------------------------------------------------------- Tidal
let tView = {kind: "tracks", loaded: false};   // lo que muestra la pestaña Tidal
let lastQueueTitle = "";
const tbody = $("tbody");

function note(text, withOpen) {
  const d = el("div", "note", text);
  if (withOpen) {
    const b = el("button", "", "Abrir Tidal");
    b.addEventListener("click", async () => {
      buzz();
      toast("Abriendo Tidal…", 15000);
      const r = await post("/api/app", {id: "tidal"}, true);
      if (r.ok) { toast("Tidal abierto"); setTimeout(() => reloadTidal(), 3000); }
    });
    d.appendChild(el("br"));
    d.appendChild(b);
  }
  return d;
}
function showError(r) { tbody.replaceChildren(note(r.error || "No se pudo", !!r.closed)); }

function thumb(item) {
  const th = el("div", "th");
  if (item.img) th.style.backgroundImage = `url("${item.img}")`;
  else th.textContent = item.type === "artist" ? "👤" : "♪";
  return th;
}
function row(item, onTap, curId) {
  const r = el("div", "it " + item.type + (item.ok === false ? " na" : "") + (curId && item.id === curId ? " cur" : ""));
  r.appendChild(thumb(item));
  const tx = el("div", "tx");
  tx.appendChild(el("div", "t1", item.title));
  const second = item.type === "track" ? [item.sub, item.dur ? fmt(item.dur) : ""].filter(Boolean).join(" · ") : item.sub;
  tx.appendChild(el("div", "t2", second || ""));
  r.appendChild(tx);
  if (item.type === "track") {
    const add = el("button", "add", "⋯");
    add.setAttribute("aria-label", "Opciones");
    add.addEventListener("click", (ev) => { ev.stopPropagation(); trackSheet(item); });
    r.appendChild(add);
  } else r.appendChild(el("span"));
  r.addEventListener("click", () => { buzz(); onTap(item); });
  return r;
}
function trackSheet(item) {
  buzz();
  const bg = el("div", "sheet-bg");
  const sh = el("div", "sheet");
  sh.appendChild(el("div", "t1", item.title));
  sh.appendChild(el("div", "t2", item.sub || ""));
  const opt = (label, fn) => {
    const b = el("button", "", label);
    b.addEventListener("click", async () => { bg.remove(); buzz(); await fn(); });
    sh.appendChild(b);
  };
  opt("▶  Reproducir ahora", () => post("/api/tidal/play", {type: "track", id: item.id}));
  opt("⤵  Que suene después de este", () => post("/api/tidal/enqueue", {id: item.id, mode: "next"}));
  opt("＋  Agregar al final de la cola", () => post("/api/tidal/enqueue", {id: item.id, mode: "end"}));
  const cancel = el("button", "", "Cancelar");
  cancel.addEventListener("click", () => bg.remove());
  sh.appendChild(cancel);
  bg.appendChild(sh);
  bg.addEventListener("click", (ev) => { if (ev.target === bg) bg.remove(); });
  document.body.appendChild(bg);
}

function segOn(kind) {
  document.querySelectorAll("#tseg button").forEach((b) => b.classList.toggle("on", b.dataset.lib === kind));
}
async function openLib(kind) {
  tView = {kind, loaded: true};
  segOn(kind);
  if (kind === "queue") return loadQueue();
  tbody.replaceChildren(note("Cargando…"));
  const r = await get(`/api/tidal/library?what=${kind}&start=0`);
  if (tView.kind !== kind) return;
  if (r.error) return showError(r);
  const list = el("div", "list");
  tbody.replaceChildren(list);
  appendLib(list, kind, r);
}
function appendLib(list, kind, r) {
  const start = r.start || 0;
  if (!r.items.length && !start) { tbody.replaceChildren(note(kind === "tracks" ? "Todavía no tenés canciones guardadas." : "No hay nada acá.")); return; }
  r.items.forEach((it, i) => list.appendChild(row(it, (item) => {
    if (kind === "tracks") post("/api/tidal/play", {type: "fav", index: start + i});
    else openDetail(item);
  })));
  const loaded = start + r.items.length;
  if (loaded < r.total) {
    const more = el("button", "loadmore", `Cargar más (${loaded} de ${r.total})`);
    more.addEventListener("click", async () => {
      more.textContent = "Cargando…";
      const n = await get(`/api/tidal/library?what=${kind}&start=${loaded}`);
      more.remove();
      if (!n.error) appendLib(list, kind, n);
    });
    tbody.appendChild(more);
  }
}

async function openDetail(item) {
  const prev = tView;
  tView = {kind: "detail", loaded: true, item, prev};
  tbody.replaceChildren(note("Cargando…"));
  const r = await get(`/api/tidal/list?type=${item.type}&id=${encodeURIComponent(item.id)}&start=0`);
  if (tView.item !== item) return;
  const back = el("button", "back", "‹ Volver");
  back.addEventListener("click", () => {
    buzz();
    if (prev.kind === "search") { tView = prev; renderSearch(prev.result, prev.q); }
    else openLib(prev.kind);
  });
  if (r.error) { tbody.replaceChildren(back, note(r.error, !!r.closed)); return; }
  const head = el("div", "detail-head");
  const th = el("div", "th");
  const img = r.img || item.img;
  if (img) th.style.backgroundImage = `url("${img}")`;
  head.appendChild(th);
  const tx = el("div");
  tx.appendChild(el("div", "t1", r.title || item.title));
  tx.appendChild(el("div", "t2", [item.type === "artist" ? "Los más escuchados" : item.sub, `${r.total} temas`].filter(Boolean).join(" · ")));
  const acts = el("div", "actions");
  const play = el("button", "go", "▶ Reproducir");
  play.addEventListener("click", () => { buzz(); post("/api/tidal/play", {type: item.type, id: item.id, index: 0}); });
  const mix = el("button", "", "🔀 Mezclar");
  mix.addEventListener("click", () => {
    buzz();
    post("/api/tidal/play", {type: item.type, id: item.id, index: Math.floor(Math.random() * Math.max(1, r.total)), shuffle: true});
  });
  acts.append(play, mix);
  tx.appendChild(acts);
  head.appendChild(tx);
  const list = el("div", "list");
  const add = (res) => {
    const start = res.start || 0;
    res.items.forEach((it, i) => list.appendChild(row(it, () => post("/api/tidal/play", {type: item.type, id: item.id, index: start + i}))));
    const loaded = start + res.items.length;
    if (loaded < res.total) {
      const more = el("button", "loadmore", `Cargar más (${loaded} de ${res.total})`);
      more.addEventListener("click", async () => {
        more.textContent = "Cargando…";
        const n = await get(`/api/tidal/list?type=${item.type}&id=${encodeURIComponent(item.id)}&start=${loaded}`);
        more.remove();
        if (!n.error) add(n);
      });
      tbody.appendChild(more);
    }
  };
  tbody.replaceChildren(back, head, list);
  add(r);
  window.scrollTo(0, 0);
}

$("tsearch").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = $("tq").value.trim();
  if (!q) return;
  $("tq").blur();
  buzz();
  segOn("");
  tView = {kind: "search", loaded: true, q};
  tbody.replaceChildren(note("Buscando…"));
  const r = await get(`/api/tidal/search?q=${encodeURIComponent(q)}`);
  if (tView.q !== q) return;
  if (r.error) return showError(r);
  tView.result = r;
  renderSearch(r, q);
});
function renderSearch(r, q) {
  segOn("");
  const frag = [];
  const section = (title, items, onTap) => {
    if (!items || !items.length) return;
    frag.push(el("div", "sub", title));
    const list = el("div", "list");
    items.forEach((it) => list.appendChild(row(it, onTap)));
    frag.push(list);
  };
  const playTrack = (it) => post("/api/tidal/play", {type: "track", id: it.id});
  if (r.top) section("Lo más parecido", [r.top], (it) => it.type === "track" ? playTrack(it) : openDetail(it));
  section("Temas", r.tracks, playTrack);
  section("Artistas", r.artists, openDetail);
  section("Discos", r.albums, openDetail);
  section("Playlists", r.playlists, openDetail);
  if (!frag.length) frag.push(note(`Nada para «${q}».`));
  tbody.replaceChildren(...frag);
}

async function loadQueue(quiet) {
  if (!quiet) tbody.replaceChildren(note("Cargando…"));
  const r = await get("/api/tidal/queue");
  if (tView.kind !== "queue") return;
  if (r.error) return showError(r);
  const frag = [];
  if (r.current) {
    frag.push(el("div", "sub", "Sonando"));
    const l = el("div", "list");
    l.appendChild(row(r.current, () => {}, r.current.id));
    frag.push(l);
  }
  if (r.queue && r.queue.length) {
    frag.push(el("div", "sub", "En la cola"));
    const l = el("div", "list");
    r.queue.forEach((it, i) => l.appendChild(row(it, () => post("/api/tidal/jump", {where: "queue", n: i}))));
    frag.push(l);
  }
  if (r.next && r.next.length) {
    frag.push(el("div", "sub", "Sigue" + (r.context ? ": " + r.context : "") + (r.total_next > r.next.length ? ` (${r.total_next})` : "")));
    const l = el("div", "list");
    r.next.forEach((it, i) => l.appendChild(row(it, () => post("/api/tidal/jump", {where: "next", n: i}))));
    frag.push(l);
  }
  if (!frag.length) frag.push(note("La cola está vacía. Elegí algo en Mis canciones, Playlists o buscá."));
  tbody.replaceChildren(...frag);
  lastQueueTitle = r.current ? r.current.title : "";
}
function reloadTidal() {
  if (tView.kind === "detail") openDetail(tView.item);
  else if (tView.kind === "search") $("tsearch").requestSubmit();
  else openLib(tView.kind);
}
$("tseg").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-lib]");
  if (b) { buzz(); openLib(b.dataset.lib); }
});

(function () {
  const alias = {control: "control", tidal: "tidal", musica: "tidal", sonido: "sound", sound: "sound"};
  let t = alias[location.hash.slice(1)];
  if (!t) { try { t = localStorage.getItem("tab"); } catch (e) {} }
  if (t && $("tab-" + t)) showTab(t);
})();
poll();
</script>
</body>
</html>
