# =============================================================================
#  tele-cec — tu configuración  (~/.config/tele-cec/config.toml)
#
#  Acá va SOLO lo que quieras cambiar. Todo lo demás toma el valor por defecto,
#  que está documentado en:
#      ~/.local/share/tele-cec/tele_cec/defaults.toml
#  (ahí están el mapeo completo de teclas, las acciones y los selectores).
#
#  Después de editar:   systemctl --user restart tele-cec
#  Para ver qué manda cada botón del control:   tele-cec aprender
# =============================================================================

# log_level = "debug"

[cec]
# port = "/dev/cec1"          # si la TV está en el HDMI 1 de la Pi 400
# device_type = "p"           # probá "p" (playback) si la TV no manda las teclas con "r"
# activate_source = "launch"  # no cambiar la entrada de la TV al arrancar la Pi

[browser]
# engine = "firefox"          # usar Firefox en vez de Chromium (o instalá con ./install.sh --firefox)
# launch = "always"           # mantener Netflix siempre abierto (modo "aparato de TV")
# kiosk = false
# reduce_effects = false      # volver a las animaciones normales (por defecto están apagadas)
# stop_previews = false       # dejar que Netflix reproduzca los avances en el inicio
# extra_args = ["--password-store=basic", "--user-agent=..."]   # solo Chromium

# [menu]                      # menú de actividades (botón Menú del control)
# items = ["netflix", "videos", "fotos", "tidal"]   # orden (y cuáles aparecen)
# timeout_s = 15              # se cierra solo si no tocás nada

# [apps.tidal]                # Tidal (High Tide): ver README → Tidal
# resume_on_open = true       # al abrir Tidal, seguir con lo último que sonaba (por defecto: Inicio, en pausa)
# start_in_nav = false        # al abrir Tidal, flechas = controles (por defecto recorren la interfaz)

# [apps.videos]               # Videos con mpv (la primera carpeta con videos: pendrive o la local)
# folders = ["/media/*/*", "~/Vídeos", "/mnt/nas/peliculas"]
# shuffle = true

# [apps.radio]                # Radio por internet con mpv (no viene ninguna). OK en el menú pone la última que
#                             # sonó; el botoncito «Radios» (o ▶) muestra la lista. covers = false: sin buscar tapas
# stations = [
#   { name = "La 100", url = "https://playerservices.streamtheworld.com/api/livestream-redirect/FM999_56.mp3" },
#   { name = "Rock & Pop", url = "https://playerservices.streamtheworld.com/api/livestream-redirect/ROCKANDPOPAAC.aac" },
#   { name = "Somos Radio (AM 530)", url = "https://live-ar1.cdnrad.com/hls/radio-2121/live.m3u8" },
#   { name = "Pipí Cucú", url = "https://comodin.uy/radio/8000/320.mp3" },
# ]

# [apps.navegador]            # Navegador: cualquier página con el control remoto (Firefox aparte, perfil propio)
# scale = 1.5                 # todo un 50 % más grande, para leer desde el sillón
# search = "https://www.google.com/search?q={q}"
# extensions = ["~/Descargas/ublock_origin.xpi"]   # uBlock Origin saca la publicidad (lo más pesado)
# bookmarks = [               # la página de inicio, el botoncito «Sitios» y las teclas 1 – 9
#   { name = "Google", url = "https://www.google.com" },
#   { name = "Wikipedia", url = "https://es.wikipedia.org" },
#   { name = "Infobae", url = "https://www.infobae.com" },
# ]

# [apps.fotos]                # Fotos con feh
# folders = ["/media/*/*", "~/Imágenes"]
# delay_s = 5                 # segundos por foto
# scroll_step = 250           # con zoom, cuánto se mueve la foto por flecha (píxeles)

# [apps.android]              # la pantalla del celular con scrcpy (./install.sh lo instala; ver README → Android)
# serial = "192.168.0.50:5555"   # por Wi‑Fi ("" = el que esté conectado por USB)
# max_size = 1280             # más liviano para la Pi

# [activities.juegos]         # otra actividad: cualquier programa (aparece al final del menú)
# name = "Juegos"
# icon = "juegos.svg"
# command = ["mame", "-rompath", "~/mame/roms"]

# [keys.global]
# F4_YELLOW = "app:tidal"     # un color que abra una actividad directo (sin el menú)

# [browser.firefox]           # solo con engine = "firefox"
# prefs = { "media.ffmpeg.vaapi.enabled" = true }   # preferencias extra para el user.js
# disable_extensions = ["uBlock Origin", "h264ify"]  # apagar extensiones en este perfil (no en tu Firefox)

# [feedback]
# key_echo = true             # mostrar cada tecla que llega (para ver si la TV la manda)
# cec_osd = true              # probar si tu TV muestra "Netflix..." al abrir el navegador
# busy = false                # sin indicador "trabajando"

[netflix]
# default_profile = 1         # "Seguir viendo" elige este perfil si aparece "¿Quién está viendo?"
# seek_seconds = 10

# --- Ejemplos de cambios de teclas (se fusionan con los de por defecto) ---
# [keys.player]
# LEFT = "seek:-30"
# F3_GREEN = "smart_skip"   # el verde viene libre (muchas TVs lo usan); acá le das una función
#
# [keys.browse]
# NUMBER9 = ["profile:1", "wait:2500", "continue_watching"]   # macro en línea
# F1_BLUE = ""                                                 # desactivar una tecla
#
# [macros]
# noche = ["profile:2", "wait:2500", "continue_watching"]
# [keys.global]
# F1_BLUE = "macro:noche"
